<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>足球生涯：抉择与传承</title>
    <style>
        :root {
            --bg: #0a0e14;
            --bg-card: #0f1923;
            --card-bg: #fafaf6;
            --text: #1a1a2e;
            --text-light: #e8e6e3;
            --gold: #c9a84c;
            --gold-light: #d4a82a;
            --bar-bg: rgba(255,255,255,0.08);
            --card-border-gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --card-border-special: linear-gradient(135deg, #3498db, #8e44ad);
            --card-border-dark: linear-gradient(135deg, #2c3e50, #000000);
            --font-main: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(26,122,76,0.06) 0%, transparent 50%);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: pan-y;
            padding: 10px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .particle { position:absolute; background:rgba(255,255,255,0.02); border-radius:50%; animation:floatUp linear infinite; }
        @keyframes floatUp { 0%{ transform:translateY(100vh) scale(0); opacity:0; } 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-10vh) scale(1.6); opacity:0;} }

        /* ==================== 游戏容器 ==================== */
        .game-container {
            position:relative; z-index:1;
            width:100%; max-width:380px;
            display:flex; flex-direction:column; align-items:center; gap:10px;
        }

        /* ==================== 顶部信息栏 - 紧凑设计 ==================== */
        .header {
            width:100%;
            display:flex; align-items:baseline; justify-content:space-between;
            padding:6px 12px;
            background:linear-gradient(135deg, rgba(201,168,76,0.12), rgba(201,168,76,0.04));
            border-radius:10px;
            border:1px solid rgba(201,168,76,0.2);
        }

        .age-badge {
            display:flex; align-items:baseline; gap:2px;
            color:var(--text-light);
        }

        .age-number {
            color:#fff;
            font-size:1.1rem; font-weight:700;
            font-family: var(--font-mono);
            line-height:1;
        }

        .age-unit {
            color:var(--gold);
            font-size:0.7rem; font-weight:600;
        }

        .season-indicator {
            color:var(--gold-light);
            font-size:0.7rem; font-weight:600;
        }

        .season-number {
            font-family: var(--font-mono);
            font-weight:700;
            font-size:0.85rem;
        }

        /* ==================== 属性面板 - 与卡片同宽 ==================== */
        .stats-panel {
            width:100%;
            display:flex; flex-direction:column; gap:6px;
            padding:10px 14px;
            background:rgba(255,255,255,0.03);
            border-radius:14px;
            border:1px solid rgba(255,255,255,0.06);
        }

        .stat-row {
            display:flex; align-items:center; gap:8px;
        }

        .stat-icon {
            width:20px; height:20px;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }

        .stat-icon svg {
            width:16px; height:16px;
        }

        .stat-label {
            width:32px;
            font-size:0.8rem;
            color:rgba(255,255,255,0.7);
            font-weight:600;
            flex-shrink:0;
        }

        .stat-bar-outer {
            flex:1; height:8px;
            background:var(--bar-bg);
            border-radius:10px;
            overflow:hidden;
        }

        .stat-bar-inner {
            height:100%;
            border-radius:10px;
            transition:width 0.45s cubic-bezier(0.25,0.8,0.25,1.2);
        }

        /* 体质 - 深红->橙红（热血、体力） */
        .stat-bar-inner.physical { background:linear-gradient(90deg,#c0392b,#e74c3c); }
        /* 名望 - 纯金->亮金（荣誉、光芒） */
        .stat-bar-inner.fame { background:linear-gradient(90deg,#f1c40f,#ffd700); }
        /* 团队 - 蓝绿（协作、信任） */
        .stat-bar-inner.team { background:linear-gradient(90deg,#3498db,#2ecc71); }
        /* 情绪 - 紫粉（活力、热情） */
        .stat-bar-inner.mood { background:linear-gradient(90deg,#9b59b6,#e91e8c); }

        .danger-low { animation:pulseDanger 0.7s infinite; }
        .danger-high { animation:pulseWarning 0.55s infinite; }
        @keyframes pulseDanger { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.7) saturate(1.6)} }
        @keyframes pulseWarning { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35) saturate(1.35)} }

        /* ==================== 卡片区域 ==================== */
        .card-area {
            position:relative;
            width:100%;
            height:min(50vh, 380px); /* 响应式高度 */
            display:flex; align-items:center; justify-content:center;
            perspective:1000px;
        }

        .card {
            position:absolute;
            width:100%; height:90%;
            background:var(--card-bg);
            border-radius:20px;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
            cursor:grab;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:clamp(16px, 3vh, 28px) clamp(16px, 4vw, 24px);
            z-index:2;
            transition:box-shadow 0.2s;
            will-change:transform;
            touch-action:none;
            background-image:linear-gradient(180deg,#fefdfb 0%,#f5f3ed 100%);
            border:none; /* 去掉边框 */
        }

        /* 普通卡片样式 - 无边框设计 */
        .card.gold {
            background-image: linear-gradient(180deg,#fffdf5 0%,#fff8e8 100%);
            box-shadow: 0 20px 60px rgba(201, 168, 76, 0.3), inset 0 0 0 2px rgba(201,168,76,0.3);
        }

        .card.special {
            background-image: linear-gradient(180deg,#f0f8ff 0%,#e8eef6 100%);
            box-shadow: 0 20px 60px rgba(52, 152, 219, 0.3), inset 0 0 0 2px rgba(52,152,219,0.3);
        }

        .card.dark {
            background-image: linear-gradient(180deg,#1a2a3a 0%,#0f1923 100%);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .card.dark .card-title { color: rgba(255,255,255,0.6); }
        .card.dark .card-description { color: #fff; }

        /* 结局卡片样式 */
        .card.ending-card {
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* 结局卡片文字阴影增强 */
        .card.ending-card .card-title {
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .card.ending-card .card-description {
            color: #fff;
            text-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }

        /* 结局卡片底部遮罩 - 增强文字可读性 */
        .card.ending-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            pointer-events: none;
            z-index: 1;
        }

        .card.ending-card .ending-title-wrapper {
            position: relative;
            z-index: 2;
        }

        /* 结局卡片具体颜色变体 - 调整渐变方向，底部更深 */
        .card.ending-card.physical-max { background: linear-gradient(160deg, #f0a04b, #e67e22, #c0392b); }
        .card.ending-card.physical-min { background: linear-gradient(160deg, #e74c3c, #c0392b, #962d22); }
        .card.ending-card.fame-max { background: linear-gradient(160deg, #f5d978, #d4a82a, #8b6914); }
        .card.ending-card.fame-min { background: linear-gradient(160deg, #d4a82a, #8b6914, #6b5210); }
        .card.ending-card.team-max { background: linear-gradient(160deg, #85c1e9, #3498db, #1a5276); }
        .card.ending-card.team-min { background: linear-gradient(160deg, #3498db, #1a5276, #0e3a5c); }
        .card.ending-card.mood-max { background: linear-gradient(160deg, #c39bd3, #8e44ad, #5b2c6f); }
        .card.ending-card.mood-min { background: linear-gradient(160deg, #8e44ad, #5b2c6f, #3d1d4e); }
        .card.ending-card.gold { background: linear-gradient(160deg, #f1c40f, #bf953f, #8b6914); }
        .card.ending-card.special { background: linear-gradient(160deg, #8e44ad, #3498db, #1a5276); }

        .card.grabbed { box-shadow:0 28px 70px rgba(0,0,0,0.7); }
        .card.flying-left { animation:flyLeft 0.35s cubic-bezier(0.55,0,0.9,0.5) forwards; }
        .card.flying-right { animation:flyRight 0.35s cubic-bezier(0.55,0,0.9,0.5) forwards; }
        .card.returning { transition:transform 0.4s cubic-bezier(0.25,0.8,0.25,1.2); transform:translateX(0) rotate(0deg)!important; }

        @keyframes flyLeft {
            0%{transform:translateX(var(--fly-start-x,0px)) rotate(var(--fly-start-r,0deg));opacity:1}
            100%{transform:translateX(-150vw) rotate(-28deg);opacity:0}
        }
        @keyframes flyRight {
            0%{transform:translateX(var(--fly-start-x,0px)) rotate(var(--fly-start-r,0deg));opacity:1}
            100%{transform:translateX(150vw) rotate(28deg);opacity:0}
        }

        .card.entering { animation:enterCard 0.4s cubic-bezier(0.25,0.8,0.25,1.15) forwards; }
        @keyframes enterCard {
            0%{transform:translateY(40px) scale(0.9);opacity:0}
            100%{transform:translateY(0) scale(1);opacity:1}
        }

        /* ==================== 卡片内容 ==================== */
        .card-scene-icon {
            width:clamp(48px, 12vw, 80px); /* 响应式图标大小 */
            height:clamp(48px, 12vw, 80px);
            margin-bottom:clamp(8px, 2vh, 16px);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .card-scene-icon svg {
            width:100%; height:100%;
        }

        .card-title {
            font-size:clamp(0.6rem, 1.5vw, 0.75rem);
            text-transform:uppercase;
            letter-spacing:2px;
            color:#999;
            margin-bottom:clamp(6px, 1.5vh, 12px);
            font-weight:600;
        }

        .card-description {
            font-size:clamp(0.85rem, 2.5vw, 1.05rem);
            text-align:center;
            color:var(--text);
            line-height:1.6;
            font-weight:400;
            flex:1;
            display:flex;
            align-items:center;
            padding:0 4px;
        }

        /* ==================== 选择覆盖层 ==================== */
        .choice-overlay {
            position: absolute; top:0; left:0;
            width:100%; height:100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 10;
            padding: 20px;
        }

        .choice-overlay.visible { opacity: 1; }

        .choice-overlay .choice-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .choice-overlay .dots-container {
            display: flex; gap: 16px;
            justify-content: center;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .dot-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            width: 40px;
        }

        .dot-circle {
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .dot-circle.pos { background: #2ecc71; box-shadow: 0 0 12px rgba(46,204,113,0.5); }
        .dot-circle.neg { background: #e74c3c; box-shadow: 0 0 12px rgba(231,76,60,0.5); }
        .dot-circle.neutral { background: #666; box-shadow: none; }
        .dot-circle.large { width: 20px; height: 20px; }
        .dot-circle.small { width: 14px; height: 14px; }

        .dot-label {
            font-size: 0.6rem;
            color:rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* ==================== 滑动提示 ==================== */
        .swipe-hint {
            color:rgba(255,255,255,0.4);
            font-size:0.65rem;
            letter-spacing:1px;
            display:flex; align-items:center; gap:8px;
            transition:opacity 0.5s;
        }

        @keyframes bounceHorizontalLeft {
            0%,100%{transform:translateX(0)}
            50%{transform:translateX(-6px)}
        }
        @keyframes bounceHorizontalRight {
            0%,100%{transform:translateX(0)}
            50%{transform:translateX(6px)}
        }

        .swipe-hint .arrow.left {
            animation:bounceHorizontalLeft 1.5s infinite;
            font-size:0.9rem;
        }
        .swipe-hint .arrow.right {
            animation:bounceHorizontalRight 1.5s infinite;
            font-size:0.9rem;
        }

        /* ==================== Toast通知 ==================== */
        .toast {
            position:fixed; top:20px; left:50%;
            transform:translateX(-50%) translateY(-120px);
            background:rgba(15,25,35,0.95);
            color:var(--text-light);
            padding:10px 20px;
            border-radius:20px;
            font-size:0.8rem; font-weight:600;
            z-index:100;
            pointer-events:none;
            transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            border:1px solid rgba(255,255,255,0.1);
            text-align:center;
            max-width:85vw;
            backdrop-filter:blur(10px);
        }

        .toast.show { transform:translateX(-50%) translateY(0); }

        .toast.milestone {
            background:linear-gradient(135deg, rgba(201,168,76,0.95), rgba(212,168,42,0.95));
            color:#1a1a2e;
            font-size:0.85rem;
            font-weight:700;
            border-color:rgba(255,255,255,0.2);
        }

        /* ==================== 结局遮罩层 ==================== */
        .ending-overlay {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,0.95);
            z-index:200;
            display:flex; flex-direction:column;
            align-items:center;
            opacity:0; pointer-events:none;
            transition:0.6s;
            padding:20px;
            overflow-y: auto;
        }

        .ending-overlay.visible { opacity:1; pointer-events:auto; }

        .result-screen {
            width: 100%; max-width: 400px;
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ending-icon {
            width:64px; height:64px;
            margin: 0 auto 12px;
            display:flex; align-items:center; justify-content:center;
        }

        .ending-icon svg {
            width:100%; height:100%;
        }

        .ending-title { font-size:1.6rem; color:#fff; font-weight:800; display:block; margin-bottom: 8px; }
        .ending-subtitle { font-size:0.85rem; color:rgba(255,255,255,0.7); text-align:center; max-width:300px; display:block; margin: 0 auto; line-height:1.5; }
        .result-stats { font-size: 0.9rem; color: var(--gold); margin-bottom: 20px; margin-top: 12px; font-weight: 600; }

        /* ==================== 时间线 ==================== */
        .timeline-container {
            width: 100%; max-width: 400px;
            margin: 0 auto 30px auto;
            position: relative;
            padding: 20px 0;
        }

        .timeline-container::before {
            content: '';
            position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.3), transparent);
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .timeline-item.show { opacity: 1; transform: translateY(0); }

        .timeline-dot {
            width: 10px; height: 10px;
            background: var(--gold);
            border-radius: 50%;
            position: absolute; left: 50%; top: 15px;
            transform: translateX(-50%);
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
            z-index: 2;
        }

        .timeline-content {
            width: 42%;
            background: rgba(255,255,255,0.04);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }

        .timeline-item:nth-child(odd) .timeline-content { margin-left: auto; }
        .timeline-item:nth-child(even) .timeline-content { margin-right: auto; }

        .timeline-year {
            font-size: 0.65rem;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timeline-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.4;
        }

        .timeline-milestone { color: #fff; font-weight: 600; }

        /* ==================== 重启按钮 ==================== */
        .restart-btn {
            margin-bottom: 20px;
            padding:12px 32px;
            background:linear-gradient(135deg, var(--gold), var(--gold-light));
            color:#1a1a2e;
            border:none;
            border-radius:24px;
            font-size:0.9rem;
            font-weight:700;
            cursor:pointer;
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .restart-btn.visible { opacity: 1; transform: translateY(0); }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(201, 168, 76, 0.4); }

        /* ==================== 结局标题 ==================== */
        .ending-title-wrapper { text-align:center; }

        .ending-glow-title {
            font-size:2.2rem;
            font-weight:800;
            color:#fff;
            text-shadow:0 0 20px rgba(255,255,255,0.6),0 0 40px rgba(255,255,255,0.3);
            margin-bottom:12px;
            line-height:1.2;
        }

        .ending-draft-text {
            font-size:0.8rem;
            color:rgba(255,255,255,0.8);
            line-height:1.5;
            text-shadow:none;
            padding:8px 0;
            margin-top:8px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ==================== 响应式 ==================== */
        @media (max-width:400px) {
            .card-area { height:320px; }
            .card { padding:20px 16px 16px; }
            .card-description { font-size:0.9rem; }
            .card-scene-icon { width:48px; height:48px; }
            .choice-overlay .choice-label { font-size:1rem; }
            .dot-circle.large { width:18px; height:18px; }
            .dot-circle.small { width:12px; height:12px; }
            .age-number { font-size:1.3rem; }
        }

        @media (max-height:700px) {
            .card-area { height:300px; }
            .game-container { gap:8px; }
        }

        /* ==================== 继续游戏对话框 ==================== */
        @keyframes dialogFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #continueOverlay > div {
            animation: dialogFadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="toast" id="toast"></div>
<div class="ending-overlay" id="endingOverlay">
    <div class="result-screen" id="resultScreen">
        <div class="ending-icon" id="endingIcon">🏆</div>
        <div class="ending-title" id="endingTitle">职业生涯结束</div>
        <div class="result-stats" id="finalStats">赛季数：0 | 事件数：0</div>
        <div class="ending-subtitle" id="endingSubtitle">你的传奇故事将被铭记</div>
    </div>

    <div class="timeline-container" id="timelineContainer"></div>
    <button class="restart-btn" id="restartBtn" onclick="restartGame()">重启人生</button>
</div>

<div class="game-container">
    <!-- 顶部信息栏 - 紧凑设计 -->
    <div class="header">
        <div class="age-badge">
            <span class="age-number" id="ageDisplay">18</span>
            <span class="age-unit">岁</span>
        </div>
        <div class="season-indicator">
            第<span class="season-number" id="seasonDisplay">1</span>赛季
        </div>
    </div>

    <!-- 属性面板 - 与卡片同宽 -->
    <div class="stats-panel">
        <div class="stat-row">
            <div class="stat-icon" id="iconPhysical"></div>
            <span class="stat-label">体质</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner physical" id="barPhysical" style="width:60%"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-icon" id="iconFame"></div>
            <span class="stat-label">名望</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner fame" id="barFame" style="width:28%"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-icon" id="iconTeam"></div>
            <span class="stat-label">团队</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner team" id="barTeam" style="width:45%"></div></div>
        </div>
        <div class="stat-row">
