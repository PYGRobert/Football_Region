<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>足球生涯：抉择与传承</title>
    <style>
        :root {
            --bg: #0a0e14;
            --bg-card: #0f1923;
            --card-bg: #fafaf6;
            --text: #1a1a2e;
            --text-light: #e8e6e3;
            --gold: #c9a84c;
            --gold-light: #d4a82a;
            --bar-bg: rgba(255,255,255,0.08);
            --font-main: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(26,122,76,0.06) 0%, transparent 50%);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: pan-y;
            padding: 10px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .particle { position:absolute; background:rgba(255,255,255,0.02); border-radius:50%; animation:floatUp linear infinite; }
        @keyframes floatUp { 0%{ transform:translateY(100vh) scale(0); opacity:0; } 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-10vh) scale(1.6); opacity:0;} }

        /* ==================== 游戏容器 ==================== */
        .game-container {
            position:relative; z-index:1;
            width:100%; max-width:380px;
            display:flex; flex-direction:column; align-items:center; gap:10px;
        }

        /* ==================== 卡片区域 ==================== */
        .card-area {
            position:relative;
            width:100%;
            height:min(56vh, 420px);
            display:flex; align-items:center; justify-content:center;
            perspective:1000px;
        }

        .card {
            position:absolute;
            width:100%; height:92%;
            background:var(--card-bg);
            border-radius:20px;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
            cursor:grab;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:clamp(20px, 4vh, 32px) clamp(16px, 4vw, 24px);
            z-index:2;
            transition:box-shadow 0.2s;
            will-change:transform;
            touch-action:none;
            background-image:linear-gradient(180deg,#fefdfb 0%,#f5f3ed 100%);
            border:none;
        }

        /* ==================== 特殊事件卡片样式 (v1.5 重新设计) ==================== */
        /* 金色 — 世界杯/欧冠/冠军赛事：皇家暗金风格 */
        .card.gold {
            background-image: linear-gradient(160deg, #1c1700 0%, #2a2000 40%, #1a1500 100%);
            box-shadow: 0 20px 60px rgba(201,168,76,0.25), inset 0 1px 0 rgba(201,168,76,0.15);
            border: 1px solid rgba(201,168,76,0.2);
        }
        .card.gold .card-title { color: rgba(201,168,76,0.9); letter-spacing: 3px; }
        .card.gold .card-description { color: rgba(255,248,230,0.95); }
        .card.gold .card-scene-icon { filter: drop-shadow(0 4px 16px rgba(201,168,76,0.3)); }

        /* 靛蓝 — 转会/德比/教练/财务/传奇链式事件：深邃星空风格 */
        .card.special {
            background-image: linear-gradient(160deg, #0d1b2a 0%, #1a1a3e 50%, #0d1b2a 100%);
            box-shadow: 0 20px 60px rgba(30,60,120,0.3), inset 0 1px 0 rgba(100,160,255,0.1);
            border: 1px solid rgba(80,120,200,0.15);
        }
        .card.special .card-title { color: rgba(120,170,255,0.8); letter-spacing: 3px; }
        .card.special .card-description { color: rgba(220,230,255,0.95); }
        .card.special .card-scene-icon { filter: drop-shadow(0 4px 16px rgba(80,120,220,0.3)); }

        /* 暗红 — 更衣室/伤病/负面事件：压迫暗夜风格 */
        .card.dark {
            background-image: linear-gradient(160deg, #1a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,100,100,0.08);
            border: 1px solid rgba(255,100,100,0.1);
        }
        .card.dark .card-title { color: rgba(255,120,120,0.7); letter-spacing: 3px; }
        .card.dark .card-description { color: rgba(255,230,230,0.95); }
        .card.dark .card-scene-icon { filter: drop-shadow(0 4px 16px rgba(200,60,60,0.2)); }

        /* 结局卡片样式 */
        .card.ending-card {
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .card.ending-card .card-title {
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .card.ending-card .card-description {
            color: #fff;
            text-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }

        /* 浅色球员背景 → 深色文字 (vs白色文字对比度不足) */
        .card.ending-card.player-light-bg .card-title {
            color: rgba(30,30,50,0.9) !important;
            text-shadow: 0 1px 4px rgba(255,255,255,0.3) !important;
        }
        .card.ending-card.player-light-bg .card-description {
            color: #1a1a2e !important;
            text-shadow: 0 1px 6px rgba(255,255,255,0.25) !important;
        }
        .card.ending-card.player-light-bg .ending-glow-title {
            color: #1a1a2e;
            text-shadow: 0 0 16px rgba(0,0,0,0.15),0 0 32px rgba(0,0,0,0.1);
        }
        .card.ending-card.player-light-bg .ending-draft-text {
            color: rgba(30,30,50,0.85);
        }
        .card.ending-card.player-light-bg .player-name-tag {
            color: rgba(30,30,50,0.6);
        }

        .card.ending-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            pointer-events: none;
            z-index: 1;
        }

        .card.ending-card .ending-title-wrapper {
            position: relative;
            z-index: 2;
        }

        /* 结局卡片颜色变体 */
        /* 财富 - 金色系 */
        .card.ending-card.wealth-max { background: linear-gradient(160deg, #f9e076, #e6c300, #b8960f); }
        .card.ending-card.wealth-min { background: linear-gradient(160deg, #8b6914, #6b5210, #3a2804); }
        /* 能力 - 蓝色系 */
        .card.ending-card.ability-max { background: linear-gradient(160deg, #85c1e9, #3498db, #1a5276); }
        .card.ending-card.ability-min { background: linear-gradient(160deg, #5b6c7a, #3d5060, #1a2a3a); }
        /* 团队 - 绿色系 */
        .card.ending-card.team-max { background: linear-gradient(160deg, #7dcea0, #27ae60, #145a32); }
        .card.ending-card.team-min { background: linear-gradient(160deg, #1a6e3e, #145a32, #0a2f1a); }
        /* 野心 - 红色系 */
        .card.ending-card.ambition-max { background: linear-gradient(160deg, #f1948a, #c0392b, #78281f); }
        .card.ending-card.ambition-min { background: linear-gradient(160deg, #7b5e5e, #5b3a3a, #2d1e1e); }
        /* 伤仲永 - 流星金色（辉煌过，转瞬即逝） */
        .card.ending-card.wonderkid { background: linear-gradient(160deg, #f9e79f, #c9a84c, #4a4a4a); }
        /* 球队名宿 - 暖琥珀色（沉稳忠诚） */
        .card.ending-card.club-legend { background: linear-gradient(160deg, #f0c27a, #e67e22, #6b3a1f); }
        /* 球王 - 亮白金色（终极荣耀） */
        .card.ending-card.ballon-dor { background: linear-gradient(160deg, #fef9e7, #f1c40f, #b8860b); }
        /* 正常退役 - 青灰色（宁静告别） */
        .card.ending-card.age { background: linear-gradient(160deg, #7faaaf, #4a7c82, #2c3e50); }
        /* 保底通用 */
        .card.ending-card.gold { background: linear-gradient(160deg, #f1c40f, #bf953f, #8b6914); }
        .card.ending-card.special { background: linear-gradient(160deg, #8e44ad, #3498db, #1a5276); }

        .card.grabbed { box-shadow:0 28px 70px rgba(0,0,0,0.7); }
        .card.flying-left { animation:flyLeft 0.35s cubic-bezier(0.55,0,0.9,0.5) forwards; }
        .card.flying-right { animation:flyRight 0.35s cubic-bezier(0.55,0,0.9,0.5) forwards; }
        .card.returning { transition:transform 0.4s cubic-bezier(0.25,0.8,0.25,1.2); transform:translateX(0) rotate(0deg)!important; }

        @keyframes flyLeft {
            0%{transform:translateX(var(--fly-start-x,0px)) rotate(var(--fly-start-r,0deg));opacity:1}
            100%{transform:translateX(-150vw) rotate(-28deg);opacity:0}
        }
        @keyframes flyRight {
            0%{transform:translateX(var(--fly-start-x,0px)) rotate(var(--fly-start-r,0deg));opacity:1}
            100%{transform:translateX(150vw) rotate(28deg);opacity:0}
        }

        .card.entering { animation:enterCard 0.4s cubic-bezier(0.25,0.8,0.25,1.15) forwards; }
        @keyframes enterCard {
            0%{transform:translateY(40px) scale(0.9);opacity:0}
            100%{transform:translateY(0) scale(1);opacity:1}
        }

        /* ==================== 卡片内容 ==================== */
        .card-scene-icon {
            width:clamp(64px, 18vw, 105px);
            height:clamp(64px, 18vw, 105px);
            margin-bottom:clamp(8px, 2vh, 18px);
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }

        .card-scene-icon img {
            width:100%; height:100%;
            display:block;
            object-fit:contain;
        }

        .card-title {
            font-size:clamp(0.6rem, 1.5vw, 0.75rem);
            text-transform:uppercase;
            letter-spacing:2px;
            color:#999;
            margin-bottom:clamp(6px, 1.5vh, 12px);
            font-weight:600;
            text-align:center;
            width:100%;
        }

        .card-description {
            font-size:clamp(0.85rem, 2.5vw, 1.05rem);
            text-align:center;
            color:var(--text);
            line-height:1.6;
            font-weight:400;
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:0 4px;
            width:100%;
        }

        /* ==================== 选择覆盖层 ==================== */
        .choice-overlay {
            position: absolute; top:0; left:0;
            width:100%; height:100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 10;
            padding: 20px;
        }

        .choice-overlay.visible { opacity: 1; }

        .choice-overlay .choice-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .choice-overlay .dots-container {
            display: flex; gap: 16px;
            justify-content: center;
            align-items: flex-end;
            flex-wrap: wrap;
            width: 100%;
        }

        .dot-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            width: 40px;
        }

        .dot-circle {
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .dot-circle.pos { background: #2ecc71; box-shadow: 0 0 12px rgba(46,204,113,0.5); }
        .dot-circle.neg { background: #e74c3c; box-shadow: 0 0 12px rgba(231,76,60,0.5); }
        .dot-circle.neutral { background: #666; box-shadow: none; }
        .dot-circle.large { width: 20px; height: 20px; }
        .dot-circle.small { width: 14px; height: 14px; }

        .dot-label {
            font-size: 0.6rem;
            color:rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* ==================== 属性面板（顶部） ==================== */
        .stats-panel {
            width:100%;
            display:flex; flex-direction:column; gap:6px;
            padding:10px 14px;
            background:rgba(255,255,255,0.03);
            border-radius:14px;
            border:1px solid rgba(255,255,255,0.06);
        }

        .stat-row {
            display:flex; align-items:center; gap:8px;
        }

        .stat-icon {
            width:20px; height:20px;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }

        .stat-icon img {
            width:16px; height:16px;
            display:block;
        }

        .stat-label {
            width:32px;
            font-size:0.8rem;
            color:rgba(255,255,255,0.7);
            font-weight:600;
            flex-shrink:0;
        }

        .stat-bar-outer {
            flex:1; height:8px;
            background:var(--bar-bg);
            border-radius:10px;
            overflow:hidden;
        }

        .stat-bar-inner {
            height:100%;
            border-radius:10px;
            transition:width 0.45s cubic-bezier(0.25,0.8,0.25,1.2);
        }

        /* 财富 - 金色 */
        .stat-bar-inner.wealth { background:linear-gradient(90deg,#f1c40f,#ffd700); }
        /* 能力 - 蓝色 */
        .stat-bar-inner.ability { background:linear-gradient(90deg,#3498db,#2980b9); }
        /* 团队 - 绿色 */
        .stat-bar-inner.team { background:linear-gradient(90deg,#2ecc71,#27ae60); }
        /* 野心 - 红色 */
        .stat-bar-inner.ambition { background:linear-gradient(90deg,#e74c3c,#c0392b); }

        /* 属性条微光泽 (v1.5) */
        .stat-bar-inner {
            position: relative;
            overflow: hidden;
        }
        .stat-bar-inner::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: barShimmer 2.5s ease-in-out infinite;
        }
        @keyframes barShimmer {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .danger-low { animation:pulseDanger 0.7s infinite; }
        .danger-high { animation:pulseWarning 0.55s infinite; }
        @keyframes pulseDanger { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.7) saturate(1.6)} }
        @keyframes pulseWarning { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35) saturate(1.35)} }

        /* 顶部信息栏 - 紧凑设计（现在在底部） */
        .header {
            width:100%;
            display:flex; align-items:baseline; justify-content:space-between;
            padding:6px 12px;
            background:linear-gradient(135deg, rgba(201,168,76,0.12), rgba(201,168,76,0.04));
            border-radius:10px;
            border:1px solid rgba(201,168,76,0.2);
        }

        .age-badge {
            display:flex; align-items:baseline; gap:2px;
            color:var(--text-light);
        }

        .age-number {
            color:#fff;
            font-size:1.1rem; font-weight:700;
            font-family: var(--font-mono);
            line-height:1;
        }

        .age-unit {
            color:var(--gold);
            font-size:0.7rem; font-weight:600;
        }

        .season-indicator {
            color:var(--gold-light);
            font-size:0.7rem; font-weight:600;
        }

        .season-number {
            font-family: var(--font-mono);
            font-weight:700;
            font-size:0.85rem;
        }

        /* v1.5: 声望称呼（底部栏中央） */
        .rep-level-badge {
            font-size:0.6rem;
            color:var(--gold);
            font-weight:600;
            letter-spacing:0.5px;
            opacity:0.85;
        }

        /* v1.5: 声望点阵区域 */
        .rep-dots-section {
            width:100%;
            margin-top:12px;
            padding-top:10px;
            border-top:1px solid rgba(255,255,255,0.08);
            display:flex; flex-direction:column;
            align-items:center; gap:4px;
        }
        .rep-dots-label {
            font-size:0.55rem;
            color:rgba(255,255,255,0.4);
            letter-spacing:1px;
            text-transform:uppercase;
        }
        .rep-dots-row {
            display:flex; gap:5px; align-items:center; justify-content:center;
        }
        .rep-dot {
            width:8px; height:8px;
            border-radius:50%;
            transition: all 0.2s ease;
        }
        .rep-dot.pos { background:#2ecc71; box-shadow:0 0 8px rgba(46,204,113,0.5); }
        .rep-dot.neg { background:#e74c3c; box-shadow:0 0 8px rgba(231,76,60,0.5); }

        /* ==================== 滑动提示 ==================== */
        .swipe-hint {
            color:rgba(255,255,255,0.7);
            font-size:0.7rem;
            letter-spacing:1px;
            display:flex; align-items:center; gap:10px;
            transition:opacity 0.5s;
        }

        .swipe-hint .arrow {
            display:inline-flex; align-items:center; justify-content:center;
            opacity:0.8;
        }

        .swipe-hint .arrow img {
            width:18px; height:18px;
            display:block;
        }

        @keyframes bounceHorizontalLeft {
            0%,100%{transform:translateX(0)}
            50%{transform:translateX(-6px)}
        }
        @keyframes bounceHorizontalRight {
            0%,100%{transform:translateX(0)}
            50%{transform:translateX(6px)}
        }

        .swipe-hint .arrow.left {
            animation:bounceHorizontalLeft 1.5s infinite;
        }
        .swipe-hint .arrow.right {
            animation:bounceHorizontalRight 1.5s infinite;
        }

        /* ==================== Toast通知 ==================== */
        .toast {
            position:fixed; top:20px; left:50%;
            transform:translateX(-50%) translateY(-120px);
            background:rgba(15,25,35,0.95);
            color:var(--text-light);
            padding:10px 20px;
            border-radius:20px;
            font-size:0.8rem; font-weight:600;
            z-index:100;
            pointer-events:none;
            transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            border:1px solid rgba(255,255,255,0.1);
            text-align:center;
            max-width:85vw;
            backdrop-filter:blur(10px);
            display:flex; align-items:center; justify-content:center; gap:4px;
        }

        .toast img {
            width:16px; height:16px;
            display:inline-block;
            vertical-align:middle;
        }

        .toast.show { transform:translateX(-50%) translateY(0); }

        .toast.milestone {
            background:linear-gradient(135deg, rgba(201,168,76,0.95), rgba(212,168,42,0.95));
            color:#1a1a2e;
            font-size:0.85rem;
            font-weight:700;
            border-color:rgba(255,255,255,0.2);
            box-shadow: 0 4px 30px rgba(201,168,76,0.4);
        }

        /* ==================== 结局遮罩层 ==================== */
        .ending-overlay {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,0.95);
            z-index:200;
            display:flex; flex-direction:column;
            align-items:center;
            opacity:0; pointer-events:none;
            transition:0.6s;
            padding:20px;
            overflow-y: auto;
        }

        .ending-overlay.visible { opacity:1; pointer-events:auto; }

        .result-screen {
            width: 100%; max-width: 400px;
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ending-icon {
            width:96px; height:96px;
            margin: 0 auto 12px;
            display:flex; align-items:center; justify-content:center;
        }

        .ending-icon img {
            width:100%; height:100%;
            display:block;
            object-fit:contain;
        }

        .ending-title { font-size:1.6rem; color:#fff; font-weight:800; display:block; margin-bottom: 8px; }
        .ending-subtitle { font-size:0.85rem; color:rgba(255,255,255,0.7); text-align:center; max-width:300px; display:block; margin: 0 auto; line-height:1.5; }
        .result-stats { font-size: 0.9rem; color: var(--gold); margin-bottom: 20px; margin-top: 12px; font-weight: 600; }

        /* ==================== 时间线 ==================== */
        .timeline-container {
            width: 100%; max-width: 400px;
            margin: 0 auto 30px auto;
            position: relative;
            padding: 20px 0;
        }

        .timeline-container::before {
            content: '';
            position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.3), transparent);
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .timeline-item.show { opacity: 1; transform: translateY(0); }

        .timeline-dot {
            width: 10px; height: 10px;
            background: var(--gold);
            border-radius: 50%;
            position: absolute; left: 50%; top: 15px;
            transform: translateX(-50%);
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
            z-index: 2;
            animation: timelineDotPulse 2s ease-in-out infinite;
        }
        @keyframes timelineDotPulse {
            0%,100% { box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15); }
            50% { box-shadow: 0 0 0 8px rgba(201, 168, 76, 0.08), 0 0 12px rgba(201, 168, 76, 0.2); }
        }

        .timeline-milestone-dot {
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.2), 0 0 16px rgba(201,168,76,0.4);
        }

        .timeline-content {
            width: 42%;
            background: rgba(255,255,255,0.04);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }

        .timeline-item:nth-child(odd) .timeline-content { margin-left: auto; }
        .timeline-item:nth-child(even) .timeline-content { margin-right: auto; }

        .timeline-year {
            font-size: 0.65rem;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timeline-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.4;
        }

        .timeline-milestone { color: #fff; font-weight: 600; }

        /* ==================== 重启按钮 ==================== */
        .restart-btn {
            margin-bottom: 20px;
            padding:12px 32px;
            background:linear-gradient(135deg, var(--gold), var(--gold-light));
            color:#1a1a2e;
            border:none;
            border-radius:24px;
            font-size:0.9rem;
            font-weight:700;
            cursor:pointer;
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .restart-btn.visible { opacity: 1; transform: translateY(0); }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(201, 168, 76, 0.4); }

        /* ==================== 结局标题 ==================== */
        .ending-title-wrapper { text-align:center; }

        .ending-glow-title {
            font-size:2.2rem;
            font-weight:800;
            color:#fff;
            text-shadow:0 0 20px rgba(255,255,255,0.6),0 0 40px rgba(255,255,255,0.3);
            margin-bottom:12px;
            line-height:1.2;
        }

        .ending-draft-text {
            font-size:0.8rem;
            color:rgba(255,255,255,0.8);
            line-height:1.5;
            text-shadow:none;
            padding:8px 0;
            margin-top:8px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ==================== 结局全屏布局（v1.5 引导卡/结局卡占满上下区域） ==================== */
        .game-container.game-ending-active {
            height: 100dvh;
            max-height: 100dvh;
            justify-content: center;
        }
        .game-container.game-ending-active .stats-panel,
        .game-container.game-ending-active .header,
        .game-container.game-ending-active .swipe-hint {
            display: none;
        }
        .game-container.game-ending-active .card-area {
            flex: 1;
            height: auto;
            min-height: 0;
        }
        .game-container.game-ending-active .card {
            height: 100%;
            padding: clamp(16px, 3vh, 32px) clamp(16px, 4vw, 24px);
            justify-content: center;
            gap: 0;
        }
        /* 结局卡片内容区域：纵向自适应 */
        .game-container.game-ending-active .card.ending-card .card-title {
            display: none;
        }
        .game-container.game-ending-active .card.ending-card .card-scene-icon {
            width: auto; height: auto;
            flex: 0 1 auto;
            min-height: 0;
            margin-bottom: clamp(6px, 1.5vh, 16px);
        }
        .game-container.game-ending-active .card.ending-card .card-description {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 0;
        }
        .game-container.game-ending-active .ending-title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
        }
        /* 球星肖像自适应容器 */
        .game-container.game-ending-active .card-scene-icon {
            width: auto; height: auto;
            flex: 0 1 auto;
            min-height: 0;
            margin-bottom: clamp(6px, 1.5vh, 16px);
        }
        .game-container.game-ending-active .ending-portrait-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 1;
            min-height: 0;
        }
        .game-container.game-ending-active .ending-portrait-wrap .ending-portrait {
            width: min(152px, 38vw);
            height: min(152px, 38vw);
        }
        /* 结局文字区域可滚动保护 */
        .game-container.game-ending-active .ending-draft-text {
            max-height: 40vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ==================== 响应式 ==================== */
        @media (max-width:400px) {
            .card-area { height:340px; }
            .card { padding:20px 16px 16px; }
            .card-description { font-size:0.9rem; }
            .card-scene-icon { width:56px; height:56px; }
            .choice-overlay .choice-label { font-size:1rem; }
            .dot-circle.large { width:18px; height:18px; }
            .dot-circle.small { width:12px; height:12px; }
            .age-number { font-size:1.3rem; }
        }

        @media (max-height:700px) {
            .card-area { height:320px; }
            .game-container { gap:8px; }
            .card-scene-icon { width:56px; height:56px; }
        }

        /* ==================== 继续游戏对话框 ==================== */
        @keyframes dialogFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ==================== Debug声望面板 ==================== */
        .debug-reputation {
            display:flex; align-items:center; gap:6px;
            padding:4px 10px; margin-top:4px;
            background:rgba(201,168,76,0.15);
            border-radius:8px;
            font-size:0.65rem; color:var(--gold-light);
            font-weight:600;
        }
        .debug-rep-level {
            color:rgba(255,255,255,0.5); font-weight:400;
        }
        /* ==================== 引导卡片（特殊结局展示前）(v1.5 增强) ==================== */
        .card.teaser-card {
            cursor: pointer;
            overflow: hidden;
        }
        .card.teaser-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, transparent 70%);
            animation: teaserGlow 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes teaserGlow {
            0%,100%{ opacity: 0.3; transform: scale(1); }
            50%{ opacity: 1; transform: scale(1.1); }
        }
        .teaser-content {
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            min-height:160px;
            position:relative; z-index:3;
            gap:14px;
        }
        .teaser-title {
            font-size:2.8rem;
            font-weight:900;
            letter-spacing:0.15em;
            animation: teaserPulse 1.5s ease-in-out infinite;
            -webkit-text-stroke: 0.5px rgba(255,255,255,0.1);
        }
        @keyframes teaserPulse {
            0%,100%{ opacity:0.85; transform:scale(1); filter: brightness(1); }
            50%{ opacity:1; transform:scale(1.04); filter: brightness(1.15); }
        }
        .teaser-hint {
            font-size:0.7rem;
            opacity:0.5;
            letter-spacing:0.2em;
            animation: hintFade 2s ease-in-out infinite;
            text-transform: uppercase;
        }
        @keyframes hintFade {
            0%,100%{ opacity:0.3; transform: translateY(0); }
            50%{ opacity:0.7; transform: translateY(-2px); }
        }
        /* 引导卡片阶段隐藏空的icon和title */
        .game-container.game-ending-active .card.teaser-card .card-scene-icon,
        .game-container.game-ending-active .card.teaser-card .card-title {
            display: none;
        }
        .game-container.game-ending-active .card.teaser-card .card-description {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 引导卡片→结局卡片 淡入替换 (v1.5 重做) */
        .card.fade-swap-out {
            animation: fadeSwapOut 0.5s ease-in forwards;
            pointer-events: none;
        }
        @keyframes fadeSwapOut {
            0%   { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.96); }
        }
        .card.fade-swap-in {
            animation: fadeSwapIn 0.6s ease-out forwards;
        }
        @keyframes fadeSwapIn {
            0%   { opacity: 0; transform: scale(0.96) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* ==================== 球星模板卡片 ==================== */
        .player-template-card {
            position:relative; overflow:hidden;
        }
        /* 结局卡片-球星肖像（通用，无球星模板时使用） */
        .ending-portrait-wrap {
            display:flex; align-items:center; justify-content:center;
            width:100%; margin-bottom:8px;
        }
        .ending-portrait {
            width:100px; height:100px;
            border-radius:50%;
            border:3px solid rgba(255,255,255,0.35);
            background:rgba(255,255,255,0.08);
            display:flex; align-items:center; justify-content:center;
            overflow:hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        /* 特殊结局球星肖像（有模板匹配时由JS设置内联尺寸覆盖） */
        .ending-portrait img {
            width:100%; height:100%; object-fit:cover;
        }
        .ending-portrait-icon {
            border-style: dashed;
            border-color: rgba(255,255,255,0.2);
        }
        .player-name-tag {
            font-size:0.75rem; color:rgba(255,255,255,0.6);
            margin-top:2px; font-style:italic;
            letter-spacing:2px;
        }
        #continueOverlay > div {
            animation: dialogFadeIn 0.3s ease-out;
        }
        /* ==================== Debug面板 ==================== */
        .debug-panel {
            position:fixed; top:0; right:0; width:260px; height:100vh;
            background:rgba(10,14,20,0.97); z-index:500;
            border-left:1px solid rgba(201,168,76,0.3);
            overflow-y:auto; padding:16px;
            display:flex; flex-direction:column; gap:8px;
            font-family: var(--font-main);
            transition: transform 0.3s ease;
        }
        .debug-panel.hidden { transform: translateX(100%); }
        .debug-panel h3 {
            color:var(--gold); font-size:0.9rem;
            margin:0 0 4px 0; text-align:center;
            letter-spacing:1px;
        }
        .debug-section {
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px; padding:8px;
        }
        .debug-section h4 {
            color:rgba(255,255,255,0.5); font-size:0.65rem;
            margin:0 0 6px 0; text-transform:uppercase;
            letter-spacing:1px;
        }
        .debug-row {
            display:flex; align-items:center; gap:6px;
            margin-bottom:4px;
        }
        .debug-btn {
            flex:1; padding:5px 8px; border:1px solid rgba(255,255,255,0.15);
            border-radius:6px; background:rgba(255,255,255,0.04);
            color:rgba(255,255,255,0.8); font-size:0.6rem;
            cursor:pointer; text-align:center;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            transition: all 0.15s;
        }
        .debug-btn:hover { background:rgba(201,168,76,0.2); border-color:rgba(201,168,76,0.5); }
        .debug-btn.extreme { border-color:rgba(231,76,60,0.3); }
        .debug-btn.extreme:hover { background:rgba(231,76,60,0.15); }
        .debug-btn.hidden-ending { border-color:rgba(46,204,113,0.3); }
        .debug-btn.hidden-ending:hover { background:rgba(46,204,113,0.15); }
        .debug-btn.retire { border-color:rgba(52,152,219,0.3); }
        .debug-btn.retire:hover { background:rgba(52,152,219,0.15); }
        .debug-toggle-btn {
            position:fixed; top:10px; right:10px; z-index:501;
            width:32px; height:32px; border-radius:50%;
            border:1px solid rgba(201,168,76,0.4);
            background:rgba(10,14,20,0.9);
            color:var(--gold); font-size:0.8rem; font-weight:700;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
        }
        .debug-toggle-btn:hover { background:rgba(201,168,76,0.2); }
        .debug-rep-display {
            display:flex; align-items:center; justify-content:space-between;
            padding:6px 10px; background:rgba(201,168,76,0.1);
            border-radius:8px; margin-bottom:4px;
        }
        .debug-rep-display .rep-val { color:#fff; font-weight:700; font-size:0.85rem; }
        .debug-rep-display .rep-lvl { color:var(--gold-light); font-size:0.65rem; }
        .debug-switch {
            display:flex; align-items:center; gap:4px; font-size:0.6rem;
            color:rgba(255,255,255,0.5);
        }
        .debug-switch input { margin:0; }
    </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="toast" id="toast"></div>
<div class="debug-panel" id="debugPanel"></div>
<div class="ending-overlay" id="endingOverlay">
    <div class="result-screen" id="resultScreen">
        <div class="ending-icon" id="endingIcon"></div>
        <div class="ending-title" id="endingTitle">职业生涯结束</div>
        <div class="result-stats" id="finalStats">赛季数：0 | 事件数：0</div>
        <div class="ending-subtitle" id="endingSubtitle">你的传奇故事将被铭记</div>
    </div>

    <div class="timeline-container" id="timelineContainer"></div>
    <button class="restart-btn" id="restartBtn" onclick="restartGame()">重启人生</button>
</div>

<div class="game-container">
    <!-- 属性面板（顶部） -->
    <div class="stats-panel">
        <div class="stat-row">
            <div class="stat-icon" id="iconWealth"></div>
            <span class="stat-label">财富</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner wealth" id="barWealth" style="width:30%"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-icon" id="iconAbility"></div>
            <span class="stat-label">能力</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner ability" id="barAbility" style="width:25%"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-icon" id="iconTeam"></div>
            <span class="stat-label">团队</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner team" id="barTeam" style="width:50%"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-icon" id="iconAmbition"></div>
            <span class="stat-label">野心</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner ambition" id="barAmbition" style="width:35%"></div></div>
        </div>
        <!-- Debug: 声望值（开发用，默认隐藏） -->
        <div class="debug-reputation" id="debugReputation" style="display:none;">
            ⭐ 声望: <span id="debugRepValue">1</span>
            <span class="debug-rep-level" id="debugRepLevel">默默无闻</span>
        </div>
    </div>

    <!-- 事件卡片区域（主体） -->
    <div class="card-area" id="cardArea">
        <div class="card" id="card">
            <div class="card-scene-icon" id="cardIcon"></div>
            <div class="card-title" id="cardTitle">职业生涯</div>
            <div class="card-description" id="cardDesc">滑动卡片，开启你的足球人生</div>
            <div class="choice-overlay" id="choiceOverlay">
                <div class="choice-label" id="choiceLabel"></div>
                <div class="dots-container" id="dotsContainer"></div>
            </div>
        </div>
    </div>

    <!-- 滑动提示（卡片下方） -->
    <div class="swipe-hint" id="swipeHint">
        <span class="arrow left"><img src="assets/icons/arrow_left.png" width="18" height="18" alt="" draggable="false"></span>
        左右滑动做出选择
        <span class="arrow right"><img src="assets/icons/arrow_right.png" width="18" height="18" alt="" draggable="false"></span>
    </div>

    <!-- 年龄/赛季信息栏（底部） -->
    <div class="header">
        <div class="age-badge">
            <span class="age-number" id="ageDisplay">18</span>
            <span class="age-unit">岁</span>
        </div>
        <div class="rep-level-badge" id="repLevelDisplay">默默无闻</div>
        <div class="season-indicator">
            第<span class="season-number" id="seasonDisplay">1</span>赛季
        </div>
    </div>
</div>

<!-- JS 模块（按依赖顺序加载） -->
<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/animation.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/events_data.js"></script>
<script src="js/events.js"></script>
<script src="js/timeline.js"></script>
<script src="js/ending.js"></script>
<script src="js/card.js"></script>
<script src="js/main.js"></script>
<script src="js/debug.js"></script>
</body>
</html>
