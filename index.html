<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>足球生涯 - 滑动抉择</title>
    <style>
        :root {
            --bg: #0a0e14;
            --card-bg: #fafaf6;
            --text: #1a1a2e;
            --accent-green: #1a7a4c;
            --accent-gold: #b8922e;
            --bar-bg: rgba(255, 255, 255, 0.12);
            --hint-bg-left: rgba(26, 122, 76, 0.13);
            --hint-bg-right: rgba(184, 146, 46, 0.13);
            --hint-active-left: #0e5e38;
            --hint-active-right: #8b6918;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 25%, rgba(26, 122, 76, 0.07) 0%, transparent 65%),
                radial-gradient(ellipse at 50% 75%, rgba(184, 146, 46, 0.05) 0%, transparent 65%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            padding: 10px;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.025);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.6);
                opacity: 0;
            }
        }

        .game-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .age-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #bbb;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .age-badge .icon {
            font-size: 1.1rem;
        }
        .age-number {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .season-indicator {
            color: #aaa;
            font-size: 0.72rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0 auto;
        }

        .stats-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.025);
            border-radius: 15px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .stat-icon {
            width: 20px;
            text-align: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .stat-label {
            width: 30px;
            font-size: 0.68rem;
            color: #aaa;
            flex-shrink: 0;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        .stat-bar-outer {
            flex: 1;
            height: 7px;
            background: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .stat-bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 0.45s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative;
        }
        .stat-bar-inner.physical {
            background: linear-gradient(90deg, #c0392b, #e67e22, #f0a04b);
        }
        .stat-bar-inner.fame {
            background: linear-gradient(90deg, #8b6914, #d4a82a, #f5d978);
        }
        .stat-bar-inner.team {
            background: linear-gradient(90deg, #1a5276, #3498db, #85c1e9);
        }
        .stat-bar-inner.mood {
            background: linear-gradient(90deg, #5b2c6f, #8e44ad, #c39bd3);
        }
        .stat-value {
            display: none;
        }
        .stat-bar-inner.danger-low {
            animation: pulseDanger 0.7s ease-in-out infinite;
        }
        .stat-bar-inner.danger-high {
            animation: pulseWarning 0.55s ease-in-out infinite;
        }
        @keyframes pulseDanger {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.7) saturate(1.6);
            }
        }
        @keyframes pulseWarning {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.35) saturate(1.35);
            }
        }

        .card-area {
            position: relative;
            width: 100%;
            height: 370px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }
        .card-stack-hint {
            position: absolute;
            width: 86%;
            height: 84%;
            background: rgba(255, 255, 255, 0.025);
            border-radius: 18px;
            top: 6%;
            left: 7%;
            z-index: 0;
            transform: rotate(1deg);
            border: 1px dashed rgba(255, 255, 255, 0.05);
        }
        .card-stack-hint:nth-child(2) {
            transform: rotate(-0.7deg);
            top: 2%;
            left: 5%;
            z-index: 0;
        }

        .card {
            position: absolute;
            width: 86%;
            height: 86%;
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45), 0 3px 10px rgba(0, 0, 0, 0.2);
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px 20px;
            z-index: 2;
            transition: box-shadow 0.2s ease;
            will-change: transform;
            touch-action: none;
            background-image: linear-gradient(180deg, #fefdfb 0%, #f5f3ed 100%);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .card:active {
            cursor: grabbing;
        }
        .card.grabbed {
            box-shadow: 0 26px 55px rgba(0, 0, 0, 0.55), 0 6px 18px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.12s ease;
        }
        .card.flying-left {
            animation: flyLeft 0.35s cubic-bezier(0.55, 0, 0.9, 0.5) forwards;
        }
        .card.flying-right {
            animation: flyRight 0.35s cubic-bezier(0.55, 0, 0.9, 0.5) forwards;
        }
        .card.returning {
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            transform: translateX(0) rotate(0deg) !important;
        }
        @keyframes flyLeft {
            0% {
                transform: translateX(var(--fly-start-x)) rotate(var(--fly-start-r));
                opacity: 1;
            }
            100% {
                transform: translateX(-150vw) rotate(-28deg);
                opacity: 0;
            }
        }
        @keyframes flyRight {
            0% {
                transform: translateX(var(--fly-start-x)) rotate(var(--fly-start-r));
                opacity: 1;
            }
            100% {
                transform: translateX(150vw) rotate(28deg);
                opacity: 0;
            }
        }
        .card.entering {
            animation: enterCard 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.15) forwards;
        }
        @keyframes enterCard {
            0% {
                transform: translateY(40px) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .card-scene-icon {
            font-size: 2.6rem;
            margin-bottom: 6px;
        }
        .card-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .card-description {
            font-size: 1rem;
            text-align: center;
            color: var(--text);
            line-height: 1.5;
            font-weight: 500;
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 6px;
            max-width: 100%;
        }
        .card-hint {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 2px;
            margin-top: 8px;
            gap: 14px;
        }
        .hint-left,
        .hint-right {
            font-size: 0.7rem;
            letter-spacing: 0.4px;
            text-align: center;
            flex: 1;
            transition: all 0.3s ease;
            padding: 7px 10px;
            border-radius: 8px;
            font-weight: 600;
            max-width: 46%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1.5px solid rgba(0, 0, 0, 0.08);
        }
        .hint-left {
            background: var(--hint-bg-left);
            border-color: rgba(26, 122, 76, 0.25);
            color: #2c5a3e;
        }
        .hint-right {
            background: var(--hint-bg-right);
            border-color: rgba(184, 146, 46, 0.25);
            color: #5c4a1f;
        }
        .hint-left.active {
            color: #fff;
            font-weight: 700;
            background: var(--hint-active-left);
            border-color: var(--hint-active-left);
            transform: scale(1.04);
            box-shadow: 0 4px 14px rgba(14, 94, 56, 0.35);
        }
        .hint-right.active {
            color: #fff;
            font-weight: 700;
            background: var(--hint-active-right);
            border-color: var(--hint-active-right);
            transform: scale(1.04);
            box-shadow: 0 4px 14px rgba(139, 105, 24, 0.35);
        }
        .hint-left.locked,
        .hint-right.locked {
            opacity: 0.35;
            color: #999;
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.05);
            cursor: not-allowed;
        }
        .choice-arrow-left,
        .choice-arrow-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.2rem;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 3;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .choice-arrow-left {
            left: -36px;
            color: #1a7a4c;
        }
        .choice-arrow-right {
            right: -36px;
            color: #b8922e;
        }
        .choice-arrow-left.visible,
        .choice-arrow-right.visible {
            opacity: 0.9;
        }

        .swipe-hint {
            color: #666;
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            text-align: center;
            transition: opacity 0.5s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .swipe-hint .arrow {
            display: inline-block;
            animation: bounceHorizontal 1.5s ease-in-out infinite;
            font-size: 0.9rem;
        }
        .swipe-hint .arrow:nth-child(1) {
            animation-delay: 0s;
        }
        .swipe-hint .arrow:nth-child(3) {
            animation-delay: 0.3s;
            animation-direction: reverse;
        }
        @keyframes bounceHorizontal {
            0%,
            100% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(7px);
            }
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-130px);
            background: rgba(20, 20, 28, 0.94);
            color: #f0e6d3;
            padding: 11px 22px;
            border-radius: 22px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 88vw;
            line-height: 1.45;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.milestone {
            background: rgba(184, 146, 46, 0.93);
            color: #1a1a2e;
            border-color: #c9a84c;
            font-size: 0.85rem;
            padding: 12px 22px;
            font-weight: 700;
        }

        .ending-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            padding: 20px;
        }
        .ending-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .ending-icon {
            font-size: 4.5rem;
            animation: endingBounce 0.8s ease-out;
        }
        @keyframes endingBounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .ending-title {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
        }
        .ending-subtitle {
            font-size: 0.85rem;
            color: #ccc;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;
        }
        .ending-stats {
            color: #999;
            font-size: 0.75rem;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .restart-btn {
            margin-top: 14px;
            padding: 13px 34px;
            background: var(--accent-gold);
            color: #1a1a2e;
            border: none;
            border-radius: 28px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .restart-btn:hover {
            background: #d4a830;
            transform: scale(1.04);
            box-shadow: 0 8px 25px rgba(184, 146, 46, 0.4);
        }
        .restart-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 400px) {
            .card-area {
                height: 330px;
            }
            .card {
                padding: 18px 14px 14px;
                border-radius: 16px;
            }
            .card-description {
                font-size: 0.9rem;
            }
            .card-scene-icon {
                font-size: 2rem;
            }
            .stats-panel {
                padding: 7px 10px;
                gap: 4px;
            }
            .stat-bar-outer {
                height: 6px;
            }
            .header {
                padding: 5px 12px;
            }
            .hint-left,
            .hint-right {
                font-size: 0.64rem;
                padding: 5px 7px;
            }
        }
        @media (min-width: 768px) {
            .card-area {
                height: 400px;
            }
            .card {
                border-radius: 22px;
                padding: 28px 24px 22px;
            }
            .card-description {
                font-size: 1.08rem;
            }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="toast" id="toast"></div>

    <div class="ending-overlay" id="endingOverlay">
        <div class="ending-icon" id="endingIcon"></div>
        <div class="ending-title" id="endingTitle"></div>
        <div class="ending-subtitle" id="endingSubtitle"></div>
        <div class="ending-stats" id="endingStats"></div>
        <button class="restart-btn" onclick="restartGame()">🔄 重新开始职业生涯</button>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="header">
            <div class="age-badge">
                <span class="icon">👤</span>
                <span>年龄</span>
                <span class="age-number" id="ageDisplay">18</span>
            </div>
            <div class="season-indicator" id="seasonDisplay">🏆 第1赛季</div>
            <div></div>
        </div>

        <div class="stats-panel" id="statsPanel">
            <div class="stat-row">
                <span class="stat-icon">💪</span>
                <span class="stat-label">体质</span>
                <div class="stat-bar-outer"><div class="stat-bar-inner physical" id="barPhysical" style="width:60%"></div></div>
                <span class="stat-value" id="valPhysical">60</span>
            </div>
            <div class="stat-row">
                <span class="stat-icon">⭐</span>
                <span class="stat-label">名望</span>
                <div class="stat-bar-outer"><div class="stat-bar-inner fame" id="barFame" style="width:28%"></div></div>
                <span class="stat-value" id="valFame">28</span>
            </div>
            <div class="stat-row">
                <span class="stat-icon">🤝</span>
                <span class="stat-label">团队</span>
                <div class="stat-bar-outer"><div class="stat-bar-inner team" id="barTeam" style="width:45%"></div></div>
                <span class="stat-value" id="valTeam">45</span>
            </div>
            <div class="stat-row">
                <span class="stat-icon">❤️</span>
                <span class="stat-label">情绪</span>
                <div class="stat-bar-outer"><div class="stat-bar-inner mood" id="barMood" style="width:50%"></div></div>
                <span class="stat-value" id="valMood">50</span>
            </div>
        </div>

        <div class="card-area" id="cardArea">
            <div class="card-stack-hint"></div>
            <div class="card-stack-hint"></div>
            <div class="card" id="card">
                <div class="card-scene-icon" id="cardIcon">⚽</div>
                <div class="card-title" id="cardTitle">职业生涯</div>
                <div class="card-description" id="cardDesc">滑动卡片，开启你的足球人生</div>
                <div class="card-hint">
                    <span class="hint-left" id="hintLeft">👈 左滑选择</span>
                    <span class="hint-right" id="hintRight">右滑选择 👉</span>
                </div>
            </div>
            <div class="choice-arrow-left" id="arrowLeft">◀</div>
            <div class="choice-arrow-right" id="arrowRight">▶</div>
        </div>

        <div class="swipe-hint" id="swipeHint">
            <span class="arrow">←</span> 左右滑动卡片做出选择 <span class="arrow">→</span>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 粒子背景 ====================
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 22; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 13 + 9 + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                particlesContainer.appendChild(p);
            }

            // ==================== DOM引用 ====================
            const card = document.getElementById('card');
            const cardIcon = document.getElementById('cardIcon');
            const cardTitle = document.getElementById('cardTitle');
            const cardDesc = document.getElementById('cardDesc');
            const hintLeft = document.getElementById('hintLeft');
            const hintRight = document.getElementById('hintRight');
            const arrowLeft = document.getElementById('arrowLeft');
            const arrowRight = document.getElementById('arrowRight');
            const swipeHint = document.getElementById('swipeHint');
            const toast = document.getElementById('toast');
            const endingOverlay = document.getElementById('endingOverlay');
            const endingIcon = document.getElementById('endingIcon');
            const endingTitle = document.getElementById('endingTitle');
            const endingSubtitle = document.getElementById('endingSubtitle');
            const endingStats = document.getElementById('endingStats');
            const ageDisplay = document.getElementById('ageDisplay');
            const seasonDisplay = document.getElementById('seasonDisplay');

            const barPhysical = document.getElementById('barPhysical');
            const barFame = document.getElementById('barFame');
            const barTeam = document.getElementById('barTeam');
            const barMood = document.getElementById('barMood');

            // ==================== 游戏状态 ====================
            const state = {
                physical: 60,
                fame: 28,
                team: 45,
                mood: 50,
                age: 18,
                season: 1,
                eventCount: 0,
                eventsThisSeason: 0,
                eventsPerSeason: 10 + Math.floor(Math.random() * 5),
                isDragging: false,
                startX: 0,
                startY: 0,
                currentX: 0,
                currentY: 0,
                cardOffsetX: 0,
                cardOffsetY: 0,
                cardRotation: 0,
                isAnimating: false,
                gameOver: false,
                pendingEvent: null,
                recentEventIds: [],
                _peakFame: 28,
                milestoneFlags: {
                    firstGoal: false,
                    firstTransfer: false,
                    firstNationalTeam: false,
                    firstTrophy: false,
                    firstHatTrick: false,
                    firstCaptainBand: false,
                },
                chainData: {
                    injuryHistory: 0,
                    coachConflictCount: 0,
                    mediaRumorActive: false,
                    partyStreak: 0,
                }
            };

            // ==================== 工具函数 ====================
            function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

            function updateStatDisplay(statName) {
                const value = state[statName];
                const barMap = { physical: barPhysical, fame: barFame, team: barTeam, mood: barMood };
                const bar = barMap[statName];
                bar.style.width = value + '%';
                bar.classList.remove('danger-low', 'danger-high');
                if (value <= 16) bar.classList.add('danger-low');
                if (value >= 88) bar.classList.add('danger-high');
            }

            function updateAllStats() {
                updateStatDisplay('physical');
                updateStatDisplay('fame');
                updateStatDisplay('team');
                updateStatDisplay('mood');
            }

            function updateHeader() {
                ageDisplay.textContent = state.age;
                seasonDisplay.textContent = '🏆 第' + state.season + '赛季';
            }

            function showToast(msg, type = '') {
                toast.textContent = msg;
                toast.className = 'toast ' + type;
                void toast.offsetWidth;
                toast.classList.add('show');
                clearTimeout(toast._timeout);

            function checkMilestones() {

                }

                    m.firstHatTrick = true;
                    showToast('🎩 帽子戏法！全场为你起立鼓掌', 'milestone');

            // ==================== 游戏结束检查 ====================
            function checkGameOver() {
                let reason = null;
                let icon = '';
                let title = '';
                let subtitle = '';

                if (state.physical <= 0) {
                    reason = 'physical_collapse';
                    icon = '🦵';
                    title = '身体彻底垮了';
                    subtitle = '反复的伤病和透支让你的身体再也无法承受职业比赛的强度。医生严肃地告诉你：再踢下去可能会落下终身残疾。';
                }
                if (state.fame <= 0) {
                    reason = 'fame_lost';
                    icon = '👻';
                    title = '被世界遗忘';
                    subtitle = '再也没有人谈论你的名字，连经纪人也换了电话。没有俱乐部愿意签下一个毫无名气的球员。';
                }
                if (state.fame >= 100) {
                    reason = 'fame_overload';
                    icon = '📸';
                    title = '名望的反噬';
                    subtitle = '你成了全世界最耀眼的球星，但无孔不入的狗仔队和疯狂的商业活动让你彻底失去了私人空间。足球变成了纯粹的表演，你再也感受不到最初的快乐。';
                }
                if (state.team <= 0) {
                    reason = 'team_isolated';
                    icon = '🚫';
                    title = '更衣室的弃儿';
                    subtitle = '教练公开表示你不在他的计划中，队友们也对你冷眼相待。你成了球队里的透明人，最终被扫地出门。';
                }
                if (state.mood <= 0) {
                    reason = 'mental_breakdown';
                    icon = '😔';
                    title = '心理崩溃';
                    subtitle = '巨大的压力和持续的负面情绪让你患上了严重的抑郁症。足球不再带来快乐，你选择了离开这片让你痛苦的绿茵场。';
                }
                if (state.mood >= 100) {
                    reason = 'overconfidence';
                    icon = '🤯';
                    title = '狂妄的代价';
                    subtitle = '极度的自负让你在关键决赛中做出了愚蠢的个人表演，导致球队惨败。舆论将你钉在耻辱柱上。';
                }
                if (state.age >= 35 && state.physical > 18 && state.fame > 22 && state.mood > 22 && state.team > 18 && state.fame < 100) {
                    reason = 'glorious_retirement';
                    icon = '👏';
                    title = '光荣退役';
                    subtitle = '在35岁这年，你依然保持着不错的竞技状态。球迷们起立为你鼓掌，队友们将你高高抛起。一段伟大的职业生涯画上了圆满的句号。';
                }
                if (state.age >= 38) {
                    reason = 'forced_retirement';
                    icon = '⏳';
                    title = '岁月不饶人';
                    subtitle = '38岁的你身体已经跟不上节奏。虽然心中万般不舍，但时间对每个人都是公平的。是时候说再见了。';
                }

                if (reason) {
                    endGame(reason, icon, title, subtitle);
                    return true;
                }
                return false;
            }

            function endGame(reason, icon, title, subtitle) {
                state.gameOver = true;
                state._peakFame = Math.max(state._peakFame, state.fame);
                endingIcon.textContent = icon;
                endingTitle.textContent = title;
                endingSubtitle.textContent = subtitle;
                endingStats.textContent =
                    '年龄：' + state.age + '岁 | 第' + state.season + '赛季 | 声望峰值：' + Math.round(state._peakFame) +
                    ' | 经历事件：' + state.eventCount;
                endingOverlay.classList.add('visible');
            }

            window.restartGame = function() {
                state.physical = 60;
                state.fame = 28;
                state.team = 45;
                state.mood = 50;
                state.age = 18;
                state.season = 1;
                state.eventCount = 0;
                state.eventsThisSeason = 0;
                state.eventsPerSeason = 10 + Math.floor(Math.random() * 5);
                state.isDragging = false;
                state.isAnimating = false;
                state.gameOver = false;
                state.cardOffsetX = 0;
                state.cardOffsetY = 0;
                state.cardRotation = 0;
                state.pendingEvent = null;
                state.recentEventIds = [];
                state._peakFame = 28;
                state.milestoneFlags = { firstGoal: false, firstTransfer: false, firstNationalTeam: false,
                    firstTrophy: false, firstHatTrick: false, firstCaptainBand: false };
                state.chainData = { injuryHistory: 0, coachConflictCount: 0, mediaRumorActive: false, partyStreak: 0 };
                endingOverlay.classList.remove('visible');
                card.style.transform = 'translateX(0) rotate(0deg)';
                card.classList.remove('flying-left', 'flying-right', 'returning', 'grabbed');
                arrowLeft.classList.remove('visible');
                arrowRight.classList.remove('visible');
                hintLeft.classList.remove('active', 'locked');
                hintRight.classList.remove('active', 'locked');
                hintLeft.style.opacity = '1';
                hintRight.style.opacity = '1';
                swipeHint.style.opacity = '1';
                updateAllStats();
                updateHeader();
                loadNewEvent();
            };

            // ==================== 事件系统 ====================
            function getRandomEvent() {
                const eligible = allEvents.filter(ev => {
                    if (ev.condition && !ev.condition(state)) return false;
                    if (state.recentEventIds.includes(ev.id) && state.recentEventIds.length < allEvents.length - 6) {
                        if (Math.random() < 0.55) return false;
                    }
                    if (ev.chainCondition && !ev.chainCondition(state)) return false;
                    return true;
                });

                if (eligible.length === 0) {
                    return allEvents.find(e => e.id === 'generic_training') || allEvents[0];
                }

                const weighted = [];
                eligible.forEach(ev => {
                    const weight = ev.rarity === 'rare' ? 1 : ev.rarity === 'uncommon' ? 2 : 3;
                    for (let i = 0; i < weight; i++) weighted.push(ev);
                });
                return weighted[Math.floor(Math.random() * weighted.length)];
            }

            function loadNewEvent() {
                if (state.gameOver) return;

                const event = getRandomEvent();
                state.pendingEvent = event;
                state.recentEventIds.push(event.id);
                if (state.recentEventIds.length > 18) state.recentEventIds.shift();

                cardIcon.textContent = event.icon || '⚽';
                cardTitle.textContent = event.title || '职业生涯';
                cardDesc.textContent = event.description;
                hintLeft.textContent = event.choiceLeftLabel || '👈 左滑';
                hintRight.textContent = event.choiceRightLabel || '右滑 👉';
                hintLeft.classList.remove('active', 'locked');
                hintRight.classList.remove('active', 'locked');
                hintLeft.style.opacity = '1';
                hintRight.style.opacity = '1';
                arrowLeft.classList.remove('visible');
                arrowRight.classList.remove('visible');

                if (event.lockedChoice === 'left') {
                    hintRight.textContent = '🔒 不可选';
                    hintRight.classList.add('locked');
                    hintRight.style.opacity = '0.4';
                } else if (event.lockedChoice === 'right') {
                    hintLeft.textContent = '🔒 不可选';
                    hintLeft.classList.add('locked');
                    hintLeft.style.opacity = '0.4';
                }

                card.classList.remove('flying-left', 'flying-right', 'returning', 'grabbed');
                card.style.transform = 'translateX(0) rotate(0deg)';
                card.classList.add('entering');
                setTimeout(() => card.classList.remove('entering'), 400);

                state.isAnimating = false;
                swipeHint.style.opacity = state.eventCount < 3 ? '1' : '0.25';
                updateHeader();
            }

            function applyChoice(direction) {
                if (state.isAnimating || state.gameOver || !state.pendingEvent) return;
                state.isAnimating = true;

                const event = state.pendingEvent;

                if (event.lockedChoice === 'left' && direction === 'right') {
                    showToast('🔒 此选项当前不可用', '');
                    state.isAnimating = false;
                    return;
                }
                if (event.lockedChoice === 'right' && direction === 'left') {
                    showToast('🔒 此选项当前不可用', '');
                    state.isAnimating = false;
                    return;
                }

                const effects = direction === 'left' ? event.effectsLeft : event.effectsRight;

                if (effects) {
                    Object.keys(effects).forEach(stat => {
                        if (state[stat] !== undefined) {
                            state[stat] = clamp(state[stat] + effects[stat], 0, 100);
                        }
                    });
                }

                if (event.chainUpdate) {
                    event.chainUpdate(state, direction);
                }

                state._peakFame = Math.max(state._peakFame, state.fame);
                state.eventCount++;
                state.eventsThisSeason++;

                if (state.eventsThisSeason >= state.eventsPerSeason) {
                    state.eventsThisSeason = 0;
                    state.season++;
                    state.age++;
                    state.eventsPerSeason = 8 + Math.floor(Math.random() * 6);
                    if (state.age >= 30) state.physical = clamp(state.physical - 2, 0, 100);
                    if (state.age >= 34) state.physical = clamp(state.physical - 3, 0, 100);
                    showToast('📅 赛季结束！年龄 +1（当前' + state.age + '岁）', '');
                }

                updateAllStats();
                checkMilestones();

                if (checkGameOver()) {
                    endingStats.textContent =
                        '年龄：' + state.age + '岁 | 第' + state.season + '赛季 | 声望峰值：' + Math.round(state._peakFame) +
                        ' | 经历事件：' + state.eventCount;
                    return;
                }

                const flyStartX = state.cardOffsetX || 0;
                const flyStartR = state.cardRotation || 0;
                card.style.setProperty('--fly-start-x', flyStartX + 'px');
                card.style.setProperty('--fly-start-r', flyStartR + 'deg');
                card.classList.add(direction === 'left' ? 'flying-left' : 'flying-right');
                card.classList.remove('grabbed', 'returning');
                arrowLeft.classList.remove('visible');
                arrowRight.classList.remove('visible');
                hintLeft.classList.remove('active');
                hintRight.classList.remove('active');

                state.cardOffsetX = 0;
                state.cardOffsetY = 0;
                state.cardRotation = 0;
                state.pendingEvent = null;

                setTimeout(() => {
                    card.classList.remove('flying-left', 'flying-right');
                    card.style.transform = 'translateX(0) rotate(0deg)';
                    loadNewEvent();
                }, 350);
            }

            // ==================== 触摸/鼠标交互 ====================
            function getEventPos(e) {
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e
                        .changedTouches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            }

            function onStart(e) {
                if (state.isAnimating || state.gameOver) return;
                const pos = getEventPos(e);
                state.isDragging = true;
                state.startX = pos.x;
                state.startY = pos.y;
                state.currentX = pos.x;
                state.currentY = pos.y;
                card.classList.add('grabbed');
                card.classList.remove('returning', 'entering');
                card.style.transition = 'box-shadow 0.12s ease';
                swipeHint.style.opacity = '0';
            }

            function onMove(e) {
                if (!state.isDragging || state.isAnimating || state.gameOver) return;
                const pos = getEventPos(e);
                state.currentX = pos.x;
                state.currentY = pos.y;
                const dx = state.currentX - state.startX;
                const dy = state.currentY - state.startY;
                state.cardOffsetX = dx;
                state.cardOffsetY = dy;
                state.cardRotation = dx * 0.07;
                card.style.transform = 'translateX(' + dx + 'px) translateY(' + (dy * 0.3) + 'px) rotate(' + state
                    .cardRotation + 'deg)';

                const cardWidth = card.offsetWidth;
                const threshold = cardWidth * 0.28;
                if (dx < -threshold) {
                    arrowLeft.classList.add('visible');
                    arrowRight.classList.remove('visible');
                    hintLeft.classList.add('active');
                    hintRight.classList.remove('active');
                } else if (dx > threshold) {
                    arrowRight.classList.add('visible');
                    arrowLeft.classList.remove('visible');
                    hintRight.classList.add('active');
                    hintLeft.classList.remove('active');
                } else {
                    arrowLeft.classList.remove('visible');
                    arrowRight.classList.remove('visible');
                    hintLeft.classList.remove('active');
                    hintRight.classList.remove('active');
                }
            }

            function onEnd(e) {
                if (!state.isDragging) return;
                state.isDragging = false;
                card.classList.remove('grabbed');
                card.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2), box-shadow 0.2s ease';
                arrowLeft.classList.remove('visible');
                arrowRight.classList.remove('visible');
                hintLeft.classList.remove('active');
                hintRight.classList.remove('active');

                const dx = state.cardOffsetX;
                const cardWidth = card.offsetWidth;
                const threshold = cardWidth * 0.3;

                if (dx < -threshold) {
                    applyChoice('left');
                } else if (dx > threshold) {
                    applyChoice('right');
                } else {
                    card.classList.add('returning');
                    card.style.transform = 'translateX(0) rotate(0deg)';
                    state.cardOffsetX = 0;
                    state.cardOffsetY = 0;
                    state.cardRotation = 0;
                    setTimeout(() => {
                        card.classList.remove('returning');
                        card.style.transition = 'box-shadow 0.2s ease';
                    }, 400);
                    swipeHint.style.opacity = state.eventCount < 3 ? '1' : '0.25';
                }
            }

            card.addEventListener('touchstart', onStart, { passive: false });
            card.addEventListener('touchmove', onMove, { passive: false });
            card.addEventListener('touchend', onEnd);
            card.addEventListener('touchcancel', onEnd);
            card.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', (e) => {
                if (state.isDragging) {
                    e.preventDefault();
                    onMove(e);
                }
            });
            window.addEventListener('mouseup', (e) => {
                if (state.isDragging) onEnd(e);
            });
            card.addEventListener('touchmove', function(e) {
                if (state.isDragging) e.preventDefault();
            }, { passive: false });

            window.addEventListener('keydown', (e) => {
                if (state.isAnimating || state.gameOver || state.isDragging) return;
                if (e.key === 'ArrowLeft' || e.key === 'a') {
                    e.preventDefault();
                    simulateSwipe('left');
                } else if (e.key === 'ArrowRight' || e.key === 'd') {
                    e.preventDefault();
                    simulateSwipe('right');
                }
            });

            function simulateSwipe(direction) {
                if (state.isAnimating || state.gameOver) return;
                const offset = direction === 'left' ? -140 : 140;
                state.cardOffsetX = offset;
                state.cardRotation = offset * 0.07;
                card.style.transition = 'transform 0.22s ease-out, box-shadow 0.2s ease';
                card.style.transform = 'translateX(' + offset + 'px) rotate(' + state.cardRotation + 'deg)';
                card.classList.add('grabbed');
                if (direction === 'left') {
                    arrowLeft.classList.add('visible');
                    hintLeft.classList.add('active');
                } else {
                    arrowRight.classList.add('visible');
                    hintRight.classList.add('active');
                }
                setTimeout(() => {
                    applyChoice(direction);
                }, 180);
            }
