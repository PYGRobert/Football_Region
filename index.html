<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>足球生涯 · 滑动抉择</title>
    <style>
        :root {
            --bg: #0a0e14;
            --card-bg: #fafaf6;
            --text: #1a1a2e;
            --gold: #c9a84c;
            --bar-bg: rgba(255,255,255,0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 50% 30%, rgba(26,122,76,0.07) 0%, transparent 65%), radial-gradient(ellipse at 50% 80%, rgba(184,146,46,0.05) 0%, transparent 65%);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
            user-select: none; padding: 10px;
        }
        .particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .particle { position:absolute; background:rgba(255,255,255,0.03); border-radius:50%; animation:floatUp linear infinite; }
        @keyframes floatUp { 0%{ transform:translateY(100vh) scale(0); opacity:0; } 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-10vh) scale(1.6); opacity:0;} }

        .game-container { position:relative; z-index:1; width:100%; max-width:430px; display:flex; flex-direction:column; align-items:center; gap:12px; }

        /* 头部 - 赛季在右上角 */
        .header { width:100%; display:flex; align-items:center; justify-content:space-between; padding:8px 16px; background:rgba(255,255,255,0.05); border-radius:28px; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08); }
        .age-badge { display:flex; align-items:center; gap:6px; color:#ccc; font-size:0.9rem; font-weight:600; }
        .age-number { color:#fff; font-size:1.35rem; font-weight:700; }
        .season-indicator {
            color: #d4a82a; font-size:0.78rem; font-weight:700; letter-spacing:1.5px;
            background: rgba(184,146,46,0.12); padding:4px 12px; border-radius:14px;
        }

        /* 属性面板 */
        .stats-panel { width:100%; display:flex; flex-direction:column; gap:6px; padding:12px 16px; background:rgba(255,255,255,0.03); border-radius:16px; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.06); }
        .stat-row { display:flex; align-items:center; gap:8px; }
        .stat-icon { width:22px; font-size:0.85rem; text-align:center; flex-shrink:0; }
        .stat-label { width:32px; font-size:0.7rem; color:#bbb; font-weight:500; flex-shrink:0; }
        .stat-bar-outer { flex:1; height:8px; background:var(--bar-bg); border-radius:10px; overflow:hidden; }
        .stat-bar-inner { height:100%; border-radius:10px; transition:width 0.45s cubic-bezier(0.25,0.8,0.25,1.2); }
        .stat-bar-inner.physical { background:linear-gradient(90deg,#c0392b,#e67e22,#f0a04b); }
        .stat-bar-inner.fame { background:linear-gradient(90deg,#8b6914,#d4a82a,#f5d978); }
        .stat-bar-inner.team { background:linear-gradient(90deg,#1a5276,#3498db,#85c1e9); }
        .stat-bar-inner.mood { background:linear-gradient(90deg,#5b2c6f,#8e44ad,#c39bd3); }
        .stat-value { display:none; }
        .danger-low { animation:pulseDanger 0.7s infinite; }
        .danger-high { animation:pulseWarning 0.55s infinite; }
        @keyframes pulseDanger { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.7) saturate(1.6)} }
        @keyframes pulseWarning { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35) saturate(1.35)} }

        /* 卡片区域 */
        .card-area { position:relative; width:100%; height:380px; display:flex; align-items:center; justify-content:center; perspective:1000px; }
        .card { position:absolute; width:86%; height:86%; background:var(--card-bg); border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,0.5); cursor:grab; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 22px 22px; z-index:2; transition:box-shadow 0.2s; will-change:transform; touch-action:none; background-image:linear-gradient(180deg,#fefdfb 0%,#f5f3ed 100%); border:1px solid rgba(0,0,0,0.04); }
        .card.grabbed { box-shadow:0 28px 60px rgba(0,0,0,0.6); }
        .card.flying-left { animation:flyLeft 0.35s cubic-bezier(0.55,0,0.9,0.5) forwards; }
        .card.flying-right { animation:flyRight 0.35s cubic-bezier(0.55,0,0.9,0.5) forwards; }
        .card.returning { transition:transform 0.4s cubic-bezier(0.25,0.8,0.25,1.2); transform:translateX(0) rotate(0deg)!important; }
        @keyframes flyLeft { 0%{transform:translateX(var(--fly-start-x,0px)) rotate(var(--fly-start-r,0deg));opacity:1} 100%{transform:translateX(-150vw) rotate(-28deg);opacity:0} }
        @keyframes flyRight { 0%{transform:translateX(var(--fly-start-x,0px)) rotate(var(--fly-start-r,0deg));opacity:1} 100%{transform:translateX(150vw) rotate(28deg);opacity:0} }
        .card.entering { animation:enterCard 0.4s cubic-bezier(0.25,0.8,0.25,1.15) forwards; }
        @keyframes enterCard { 0%{transform:translateY(40px) scale(0.9);opacity:0} 100%{transform:translateY(0) scale(1);opacity:1} }

        .card-scene-icon { font-size:2.8rem; margin-bottom:6px; }
        .card-title { font-size:0.75rem; text-transform:uppercase; letter-spacing:2.5px; color:#999; margin-bottom:8px; font-weight:600; }
        .card-description { font-size:1.05rem; text-align:center; color:var(--text); line-height:1.55; font-weight:500; flex:1; display:flex; align-items:center; padding:0 6px; }

        /* 覆盖层 - 圆点逻辑 */
        .choice-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.22s ease;
            pointer-events: none; z-index: 10;
            padding: 24px 20px;
        }
        .choice-overlay.visible { opacity: 1; }
        .choice-overlay .choice-label {
            font-size: 1.2rem; font-weight: 700; color: #fff;
            text-align: center; margin-bottom: 20px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }
        .choice-overlay .dots-container {
            display: flex; gap: 16px; justify-content: center; align-items: flex-end; flex-wrap: wrap;
        }
        .dot-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .dot-circle {
            border-radius: 50%; transition: all 0.2s ease;
        }
        .dot-circle.pos { background: #2ecc71; box-shadow: 0 0 10px rgba(46,204,113,0.4); }
        .dot-circle.neg { background: #e74c3c; box-shadow: 0 0 10px rgba(231,76,60,0.4); }
        .dot-circle.neutral { background: #666; box-shadow: none; }
        .dot-circle.large { width: 22px; height: 22px; }
        .dot-circle.medium { width: 15px; height: 15px; }
        .dot-circle.small { width: 9px; height: 9px; }
        .dot-label {
            font-size: 0.62rem; color: #bbb; letter-spacing: 0.5px;
        }

        .swipe-hint { color:#777; font-size:0.7rem; letter-spacing:1.5px; display:flex; align-items:center; gap:8px; transition:opacity 0.5s; }
        .swipe-hint .arrow { animation:bounceHorizontal 1.5s infinite; font-size:0.95rem; }
        @keyframes bounceHorizontal { 0%,100%{transform:translateX(0)} 50%{transform:translateX(7px)} }

        .toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-130px); background:rgba(20,20,28,0.94); color:#f0e6d3; padding:12px 24px; border-radius:24px; font-size:0.85rem; font-weight:600; z-index:100; pointer-events:none; transition:transform 0.45s; border:1px solid rgba(255,255,255,0.18); text-align:center; max-width:88vw; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.milestone { background:rgba(184,146,46,0.93); color:#1a1a2e; font-size:0.88rem; font-weight:700; }

        .ending-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.88); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; opacity:0; pointer-events:none; transition:0.6s; padding:20px; }
        .ending-overlay.visible { opacity:1; pointer-events:auto; }
        .ending-icon { font-size:4rem; }
        .ending-title { font-size:1.5rem; color:#fff; font-weight:700; }
        .ending-subtitle { font-size:0.85rem; color:#ccc; text-align:center; max-width:320px; }
        .restart-btn { margin-top:14px; padding:14px 36px; background:var(--gold); color:#1a1a2e; border:none; border-radius:28px; font-size:1rem; font-weight:700; cursor:pointer; }

        @media (max-width:400px) { .card-area{height:340px} .card{padding:20px 14px 16px} .card-description{font-size:0.9rem} .card-scene-icon{font-size:2.2rem} .choice-overlay .choice-label{font-size:1rem} .dot-circle.large{width:18px;height:18px} .dot-circle.medium{width:13px;height:13px} .dot-circle.small{width:8px;height:8px} }
    </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="toast" id="toast"></div>
<div class="ending-overlay" id="endingOverlay">
    <div class="ending-icon" id="endingIcon"></div>
    <div class="ending-title" id="endingTitle"></div>
    <div class="ending-subtitle" id="endingSubtitle"></div>
    <div class="ending-stats" id="endingStats"></div>
    <button class="restart-btn" onclick="restartGame()">🔄 重新开始职业生涯</button>
</div>

<div class="game-container">
    <div class="header">
        <div class="age-badge"><span>👤</span> <span>年龄</span> <span class="age-number" id="ageDisplay">18</span></div>
        <div class="season-indicator" id="seasonDisplay">🏆 第1赛季</div>
    </div>
    <div class="stats-panel">
        <div class="stat-row"><span class="stat-icon">💪</span><span class="stat-label">体质</span><div class="stat-bar-outer"><div class="stat-bar-inner physical" id="barPhysical" style="width:60%"></div></div></div>
        <div class="stat-row"><span class="stat-icon">⭐</span><span class="stat-label">名望</span><div class="stat-bar-outer"><div class="stat-bar-inner fame" id="barFame" style="width:28%"></div></div></div>
        <div class="stat-row"><span class="stat-icon">🤝</span><span class="stat-label">团队</span><div class="stat-bar-outer"><div class="stat-bar-inner team" id="barTeam" style="width:45%"></div></div></div>
        <div class="stat-row"><span class="stat-icon">❤️</span><span class="stat-label">情绪</span><div class="stat-bar-outer"><div class="stat-bar-inner mood" id="barMood" style="width:50%"></div></div></div>
    </div>

    <div class="card-area" id="cardArea">
        <div class="card" id="card">
            <div class="card-scene-icon" id="cardIcon">⚽</div>
            <div class="card-title" id="cardTitle">职业生涯</div>
            <div class="card-description" id="cardDesc">滑动卡片，开启你的足球人生</div>
            <div class="choice-overlay" id="choiceOverlay">
                <div class="choice-label" id="choiceLabel"></div>
                <div class="dots-container" id="dotsContainer"></div>
            </div>
        </div>
    </div>
    <div class="swipe-hint" id="swipeHint"><span class="arrow">←</span> 左右滑动做出选择 <span class="arrow">→</span></div>
</div>

<script>
(function() {
    for(let i=0;i<22;i++){let p=document.createElement('div');p.className='particle';p.style.width=(Math.random()*3+1)+'px';p.style.height=p.style.width;p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*13+9)+'s';p.style.animationDelay=Math.random()*10+'s';particles.appendChild(p);}

    const card=document.getElementById('card'), cardIcon=document.getElementById('cardIcon'), cardTitle=document.getElementById('cardTitle'), cardDesc=document.getElementById('cardDesc'),
          choiceOverlay=document.getElementById('choiceOverlay'), choiceLabel=document.getElementById('choiceLabel'), dotsContainer=document.getElementById('dotsContainer'),
          swipeHint=document.getElementById('swipeHint'), toast=document.getElementById('toast'),
          endingOverlay=document.getElementById('endingOverlay'), endingIcon=document.getElementById('endingIcon'), endingTitle=document.getElementById('endingTitle'), endingSubtitle=document.getElementById('endingSubtitle'), endingStats=document.getElementById('endingStats'),
          ageDisplay=document.getElementById('ageDisplay'), seasonDisplay=document.getElementById('seasonDisplay'),
          barPhysical=document.getElementById('barPhysical'), barFame=document.getElementById('barFame'), barTeam=document.getElementById('barTeam'), barMood=document.getElementById('barMood');

    const state = {
        physical:60, fame:28, team:45, mood:50, age:18, season:1, eventCount:0, eventsThisSeason:0,
        eventsPerSeason:10+Math.floor(Math.random()*5), isDragging:false, startX:0,startY:0, cardOffsetX:0,cardOffsetY:0,cardRotation:0,
        isAnimating:false, gameOver:false, pendingEvent:null, recentEventIds:[], _peakFame:28,
        milestoneFlags:{firstGoal:false,firstTransfer:false,firstNationalTeam:false,firstTrophy:false,firstHatTrick:false,firstCaptainBand:false,ironWill:false,worldCup:false},
        chainData:{injuryHistory:0,coachConflictCount:0,partyStreak:0}
    };

    function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
    function updateStat(stat){let bar={physical:barPhysical,fame:barFame,team:barTeam,mood:barMood}[stat]; bar.style.width=state[stat]+'%'; bar.classList.remove('danger-low','danger-high'); if(state[stat]<=16)bar.classList.add('danger-low'); if(state[stat]>=88)bar.classList.add('danger-high');}
    function updateAllStats(){updateStat('physical');updateStat('fame');updateStat('team');updateStat('mood');}
    function updateHeader(){ageDisplay.textContent=state.age; seasonDisplay.textContent='🏆 第'+state.season+'赛季';}
    function showToast(msg,type=''){toast.textContent=msg;toast.className='toast '+type;void toast.offsetWidth;toast.classList.add('show');clearTimeout(toast._timeout);toast._timeout=setTimeout(()=>toast.classList.remove('show'), type==='milestone'?2200:1500);}

    const statLabels = { physical:'体质', fame:'名望', team:'团队', mood:'情绪' };
    function renderOverlay(direction){
        if(!state.pendingEvent) return;
        const label = direction==='left'? state.pendingEvent.choiceLeftLabel : state.pendingEvent.choiceRightLabel;
        const effects = direction==='left'? state.pendingEvent.effectsLeft : state.pendingEvent.effectsRight;
        choiceLabel.textContent = label;
        dotsContainer.innerHTML = '';
        Object.keys(statLabels).forEach(s=>{
            const val = effects[s] || 0;
            const abs = Math.abs(val);
            const item = document.createElement('div');
            item.className = 'dot-item';
            const dot = document.createElement('div');
            dot.className = 'dot-circle';
            if(val>0) { dot.classList.add('pos'); }
            else if(val<0) { dot.classList.add('neg'); }
            else { dot.classList.add('neutral'); }
            if(abs>8) dot.classList.add('large');
            else if(abs>4) dot.classList.add('medium');
            else dot.classList.add('small');
            item.appendChild(dot);
            const lbl = document.createElement('span');
            lbl.className = 'dot-label';
            lbl.textContent = statLabels[s];
            item.appendChild(lbl);
            dotsContainer.appendChild(item);
        });
        choiceOverlay.classList.add('visible');
    }
    function hideOverlay(){ choiceOverlay.classList.remove('visible'); }

    function checkGameOver(){
        let reason=null, icon='', title='', subtitle='';
        if(state.physical<=0){ reason='physical_min'; icon='🦵'; title='身体彻底垮了'; subtitle='反复伤病，医生警告再踢下去会终身残疾。';}
        else if(state.physical>=100){ reason='physical_max'; icon='💪'; title='沉迷健身训练'; subtitle='过度锻炼让你失去了踢球的灵性，还有药物滥用。';}
        else if(state.team<=0){ reason='team_min'; icon='🚫'; title='更衣室的弃儿'; subtitle='你被教练公开弃用，队友冷眼相待。';}
        else if(state.team>=100){ reason='team_max'; icon='🧩'; title='团队拼图'; subtitle='你成了教练战术的牺牲品，虽然团队成功，可你也不再自己。';}
        else if(state.fame<=0){ reason='fame_min'; icon='👻'; title='被世界遗忘'; subtitle='俱乐部选择把你卖掉换取现金。';}
        else if(state.fame>=100){ reason='fame_max'; icon='📸'; title='名望的反噬'; subtitle='无孔不入的媒体让你失去了私人空间。';}
        else if(state.mood<=0){ reason='mood_min'; icon='😔'; title='心理崩溃'; subtitle='严重抑郁让你无法再踏上球场。';}
        else if(state.mood>=100){ reason='mood_max'; icon='🍷'; title='快乐足球'; subtitle='放纵让你的球技逐渐驰废，沉溺于灯红酒绿。';}

        else if(state.age>=35 && state.physical>18 && state.fame>22 && state.mood>22 && state.team>18 && state.fame<100) { reason='glory'; icon='👏'; title='光荣退役'; subtitle='35岁这年，你依然保持高水平，赢得尊重。';}
        else if(state.age>=38){ reason='age'; icon='⏳'; title='岁月不饶人'; subtitle='38岁的身体已跟不上节奏。';}
        if(reason){ endGame(icon,title,subtitle); return true; }
        return false;
    }

    function endGame(icon,title,subtitle){
        state.gameOver=true; state._peakFame=Math.max(state._peakFame,state.fame);
        endingIcon.textContent=icon; endingTitle.textContent=title; endingSubtitle.textContent=subtitle;
        endingStats.textContent=`年龄：${state.age}岁 | 第${state.season}赛季 | 事件数：${state.eventCount}`;
        endingOverlay.classList.add('visible');
    }

    window.restartGame = function(){
        state.physical=60;state.fame=28;state.team=45;state.mood=50;state.age=18;state.season=1;state.eventCount=0;state.eventsThisSeason=0;
        state.eventsPerSeason=10+Math.floor(Math.random()*5); state.isDragging=false;state.isAnimating=false;state.gameOver=false;
        state.cardOffsetX=0;state.cardOffsetY=0;state.cardRotation=0; state.pendingEvent=null; state.recentEventIds=[]; state._peakFame=28;
        state.milestoneFlags={firstGoal:false,firstTransfer:false,firstNationalTeam:false,firstTrophy:false,firstHatTrick:false,firstCaptainBand:false,ironWill:false,worldCup:false};
        state.chainData={injuryHistory:0,coachConflictCount:0,partyStreak:0};
        endingOverlay.classList.remove('visible');
        card.style.transform='translateX(0) rotate(0deg)'; card.classList.remove('flying-left','flying-right','returning','grabbed');
        hideOverlay(); swipeHint.style.opacity='1'; updateAllStats(); updateHeader(); loadNewEvent();
    };

    function getRandomEvent(){
        const eligible = allEvents.filter(ev=>{
            if(ev.condition && !ev.condition(state)) return false;
            if(state.recentEventIds.includes(ev.id) && state.recentEventIds.length<allEvents.length-6) { if(Math.random()<0.55) return false; }
            if(ev.chainCondition && !ev.chainCondition(state)) return false;
            return true;
        });
        if(eligible.length===0) return allEvents.find(e=>e.id==='generic_training')||allEvents[0];
        const weighted=[]; eligible.forEach(ev=>{const w=ev.rarity==='rare'?1:ev.rarity==='uncommon'?2:3; for(let i=0;i<w;i++) weighted.push(ev);});
        return weighted[Math.floor(Math.random()*weighted.length)];
    }

    function loadNewEvent(){
        if(state.gameOver) return;
        const event = getRandomEvent();
        state.pendingEvent = event;
        state.recentEventIds.push(event.id); if(state.recentEventIds.length>18) state.recentEventIds.shift();
        cardIcon.textContent=event.icon||'⚽'; cardTitle.textContent=event.title||'职业生涯'; cardDesc.textContent=event.description;
        card.classList.remove('flying-left','flying-right','returning','grabbed'); card.style.transform='translateX(0) rotate(0deg)';
        card.classList.add('entering'); setTimeout(()=>card.classList.remove('entering'),400);
        state.isAnimating=false; swipeHint.style.opacity=state.eventCount<3?'1':'0.25';
        hideOverlay(); updateHeader();
    }

    function applyChoice(direction){
        if(state.isAnimating||state.gameOver||!state.pendingEvent) return;
        const event = state.pendingEvent;
        if((event.lockedChoice==='left'&&direction==='right')||(event.lockedChoice==='right'&&direction==='left')){ showToast('🔒 此选项不可用'); state.isAnimating=false; return; }
        state.isAnimating=true;
        const effects = direction==='left'?event.effectsLeft:event.effectsRight;
        if(effects) Object.keys(effects).forEach(s=>{ if(state[s]!==undefined) state[s]=clamp(state[s]+effects[s],0,100); });
        if(event.chainUpdate) event.chainUpdate(state,direction);
        state._peakFame=Math.max(state._peakFame,state.fame);
        state.eventCount++; state.eventsThisSeason++;
        if(state.eventsThisSeason>=state.eventsPerSeason){ state.eventsThisSeason=0; state.season++; state.age++; state.eventsPerSeason=8+Math.floor(Math.random()*6); if(state.age>=30)state.physical=clamp(state.physical-2,0,100); if(state.age>=34)state.physical=clamp(state.physical-3,0,100); showToast('📅 赛季结束！年龄 +1'); }
        updateAllStats();
        if(event.milestone && event.milestone.direction===direction && !state.milestoneFlags[event.milestone.id]){
            state.milestoneFlags[event.milestone.id]=true;
            showToast(event.milestone.text, 'milestone');
        }
        checkMilestones();
        if(checkGameOver()){ endingStats.textContent=`年龄：${state.age}岁 | 第${state.season}赛季 | 声望峰值：${Math.round(state._peakFame)} | 事件数：${state.eventCount}`; return; }

        card.style.setProperty('--fly-start-x', state.cardOffsetX+'px'); card.style.setProperty('--fly-start-r', state.cardRotation+'deg');
        card.classList.add(direction==='left'?'flying-left':'flying-right'); card.classList.remove('grabbed','returning');
        hideOverlay();
        state.cardOffsetX=0;state.cardRotation=0; state.pendingEvent=null;
        setTimeout(()=>{ card.classList.remove('flying-left','flying-right'); card.style.transform='translateX(0) rotate(0deg)'; loadNewEvent(); },350);
    }

    function checkMilestones(){
        const m=state.milestoneFlags;
        if(!m.firstGoal&&state.fame>=40&&state.eventCount>2){ m.firstGoal=true; showToast('⚽ 首球入账！','milestone'); }

    function getPos(e){ if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY}; if(e.changedTouches&&e.changedTouches.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}; return{x:e.clientX,y:e.clientY}; }
    function onStart(e){ if(state.isAnimating||state.gameOver)return; const p=getPos(e); state.isDragging=true; state.startX=p.x;state.startY=p.y; card.classList.add('grabbed'); card.classList.remove('returning','entering'); card.style.transition='box-shadow 0.12s'; swipeHint.style.opacity='0'; }
    function onMove(e){ if(!state.isDragging||state.isAnimating||state.gameOver)return; const p=getPos(e); const dx=p.x-state.startX, dy=p.y-state.startY; state.cardOffsetX=dx; state.cardRotation=dx*0.07; card.style.transform=`translateX(${dx}px) translateY(${dy*0.3}px) rotate(${state.cardRotation}deg)`;
        const w=card.offsetWidth, t=w*0.25;
        if(dx<-t){ renderOverlay('left'); }
        else if(dx>t){ renderOverlay('right'); }
        else { hideOverlay(); }
    }
    function onEnd(e){ if(!state.isDragging)return; state.isDragging=false; card.classList.remove('grabbed'); card.style.transition='transform 0.4s cubic-bezier(0.25,0.8,0.25,1.2), box-shadow 0.2s'; hideOverlay();
        const dx=state.cardOffsetX, w=card.offsetWidth, t=w*0.3;
        if(dx<-t) applyChoice('left'); else if(dx>t) applyChoice('right');
        else { card.classList.add('returning'); card.style.transform='translateX(0) rotate(0deg)'; state.cardOffsetX=0; state.cardRotation=0; setTimeout(()=>{card.classList.remove('returning'); card.style.transition='box-shadow 0.2s';},400); swipeHint.style.opacity=state.eventCount<3?'1':'0.25'; }
    }
    card.addEventListener('touchstart',onStart,{passive:false}); card.addEventListener('touchmove',onMove,{passive:false}); card.addEventListener('touchend',onEnd); card.addEventListener('touchcancel',onEnd);
    card.addEventListener('mousedown',onStart); window.addEventListener('mousemove',e=>{if(state.isDragging){e.preventDefault();onMove(e);}}); window.addEventListener('mouseup',e=>{if(state.isDragging)onEnd(e);});
    card.addEventListener('touchmove',e=>{if(state.isDragging)e.preventDefault();},{passive:false});
    window.addEventListener('keydown',e=>{ if(state.isAnimating||state.gameOver||state.isDragging)return; if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();simulateSwipe('left');} else if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();simulateSwipe('right');} });
