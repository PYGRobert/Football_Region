<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>足球生涯：抉择与传承 v2.2</title>
    <style>
        :root {
            --bg: #0a0e14;
            --bg-card: #0f1923;
            --card-bg: #fafaf6;
            --text: #1a1a2e;
            --text-light: #e8e6e3;
            --gold: #c9a84c;
            --gold-light: #d4a82a;
            --bar-bg: rgba(255,255,255,0.08);
            --font-main: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(26,122,76,0.07) 0%, transparent 50%);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: pan-y;
            padding: 10px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .particle { position:absolute; background:rgba(255,255,255,0.02); border-radius:50%; animation:floatUp linear infinite; }
        @keyframes floatUp { 0%{ transform:translateY(100vh) scale(0); opacity:0; } 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-10vh) scale(1.6); opacity:0;} }

        /* ==================== 游戏容器 ==================== */
        .game-container {
            position:relative; z-index:1;
            width:100%; max-width:380px;
            display:flex; flex-direction:column; align-items:center; gap:10px;
        }

        /* ==================== 卡片区域 ==================== */
        .card-area {
            position:relative;
            width:100%;
            height:min(56vh, 420px);
            display:flex; align-items:center; justify-content:center;
            perspective:800px;
        }

        .card {
            position:absolute;
            width:100%; height:92%;
            background:var(--card-bg);
            border-radius:20px;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
            cursor:grab;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:clamp(20px, 4vh, 32px) clamp(16px, 4vw, 24px);
            z-index:2;
            transition:box-shadow 0.2s;
            will-change:transform;
            touch-action:none;
            background-image:linear-gradient(180deg,#fefdfb 0%,#f5f3ed 100%);
            border:none;
        }

        /* ═══════════════════════════════════════════════════════
           v2.4 赛事色系 — 高饱和, 高区分度
           ═══════════════════════════════════════════════════════ */
        /* 国内杯赛 — 琥珀金 */
        .card.cup {
            background-image: linear-gradient(160deg, #3d2600 0%, #2a1800 40%, #1a0e00 100%);
            box-shadow: 0 20px 60px rgba(232,160,0,0.3), inset 0 1px 0 rgba(232,160,0,0.15);
            border: 1px solid rgba(232,160,0,0.22);
        }
        .card.cup .card-title { color: rgba(245,185,55,0.92); letter-spacing: 3px; }
        .card.cup .card-description { color: rgba(255,240,210,0.95); }
        .card.cup .card-scene-icon { filter: drop-shadow(0 4px 16px rgba(232,160,0,0.35)); }
        /* 欧冠 — 电光蓝 */
        .card.ucl {
            background-image: linear-gradient(160deg, #0a1a35 0%, #0d2040 40%, #061025 100%);
            box-shadow: 0 20px 60px rgba(30,80,220,0.35), inset 0 1px 0 rgba(60,130,255,0.12);
            border: 1px solid rgba(50,120,240,0.2);
        }
        .card.ucl .card-title { color: rgba(90,160,255,0.92); letter-spacing: 3px; }
        .card.ucl .card-description { color: rgba(210,230,255,0.95); }
        .card.ucl .card-scene-icon { filter: drop-shadow(0 4px 20px rgba(40,100,240,0.4)); }
        /* 世界杯 — 纯金 */
        .card.wc {
            background-image: linear-gradient(160deg, #3d2c00 0%, #2a1e00 40%, #1a1000 100%);
            box-shadow: 0 20px 60px rgba(255,200,0,0.35), inset 0 1px 0 rgba(255,210,40,0.18);
            border: 1px solid rgba(255,200,0,0.28);
        }
        .card.wc .card-title { color: rgba(255,215,0,0.95); letter-spacing: 3px; }
        .card.wc .card-description { color: rgba(255,248,220,0.95); }
        .card.wc .card-scene-icon { filter: drop-shadow(0 4px 20px rgba(255,200,0,0.45)); }

        /* ═══════════════════════════════════════════════════════
           v2.4 类别色系 — 中饱和, 六色区分
           ═══════════════════════════════════════════════════════ */
        /* 伤病 — 暗红 */
        .card.injury {
            background-image: linear-gradient(160deg, #2a0d14 0%, #1f0a10 40%, #14070a 100%);
            box-shadow: 0 20px 60px rgba(200,50,60,0.25), inset 0 1px 0 rgba(220,70,80,0.1);
            border: 1px solid rgba(210,60,75,0.18);
        }
        .card.injury .card-title { color: rgba(255,110,125,0.85); letter-spacing: 2px; }
        .card.injury .card-description { color: rgba(255,215,220,0.95); }
        .card.injury .card-scene-icon { filter: drop-shadow(0 4px 14px rgba(200,50,60,0.25)); }
        /* 教练 — 皇家紫 */
        .card.coach {
            background-image: linear-gradient(160deg, #1a0d2e 0%, #150a24 40%, #0e0618 100%);
            box-shadow: 0 20px 60px rgba(110,40,180,0.25), inset 0 1px 0 rgba(140,70,200,0.1);
            border: 1px solid rgba(130,60,200,0.18);
        }
        .card.coach .card-title { color: rgba(175,125,225,0.85); letter-spacing: 2px; }
        .card.coach .card-description { color: rgba(225,210,250,0.95); }
        .card.coach .card-scene-icon { filter: drop-shadow(0 4px 14px rgba(110,40,180,0.25)); }
        /* 更衣室 — 深青 */
        .card.locker {
            background-image: linear-gradient(160deg, #0d1f1c 0%, #0a1815 40%, #06100e 100%);
            box-shadow: 0 20px 60px rgba(20,160,140,0.22), inset 0 1px 0 rgba(40,180,160,0.1);
            border: 1px solid rgba(30,170,150,0.16);
        }
        .card.locker .card-title { color: rgba(80,210,190,0.85); letter-spacing: 2px; }
        .card.locker .card-description { color: rgba(200,245,238,0.95); }
        .card.locker .card-scene-icon { filter: drop-shadow(0 4px 14px rgba(20,160,140,0.25)); }
        /* 媒体 — 铜橙 */
        .card.media {
            background-image: linear-gradient(160deg, #2a1808 0%, #1f1006 40%, #140a04 100%);
            box-shadow: 0 20px 60px rgba(210,120,30,0.22), inset 0 1px 0 rgba(230,140,50,0.1);
            border: 1px solid rgba(220,135,40,0.16);
        }
        .card.media .card-title { color: rgba(240,160,65,0.85); letter-spacing: 2px; }
        .card.media .card-description { color: rgba(255,235,210,0.95); }
        .card.media .card-scene-icon { filter: drop-shadow(0 4px 14px rgba(210,120,30,0.25)); }
        /* 商业 — 森绿 */
        .card.business {
            background-image: linear-gradient(160deg, #0f1f14 0%, #0a1810 40%, #06100a 100%);
            box-shadow: 0 20px 60px rgba(30,160,80,0.22), inset 0 1px 0 rgba(50,180,100,0.1);
            border: 1px solid rgba(40,170,95,0.16);
        }
        .card.business .card-title { color: rgba(80,215,120,0.85); letter-spacing: 2px; }
        .card.business .card-description { color: rgba(205,248,220,0.95); }
        .card.business .card-scene-icon { filter: drop-shadow(0 4px 14px rgba(30,160,80,0.25)); }

        /* 结局卡片样式 */
        .card.ending-card {
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .card.ending-card .card-title {
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .card.ending-card .card-description {
            color: #fff;
            text-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }

        /* 浅色球员背景 → 深色文字 (vs白色文字对比度不足) */
        .card.ending-card.player-light-bg .card-title {
            color: rgba(30,30,50,0.9) !important;
            text-shadow: 0 1px 4px rgba(255,255,255,0.3) !important;
        }
        .card.ending-card.player-light-bg .card-description {
            color: #1a1a2e !important;
            text-shadow: 0 1px 6px rgba(255,255,255,0.25) !important;
        }
        .card.ending-card.player-light-bg .ending-glow-title {
            color: #1a1a2e;
            text-shadow: 0 0 16px rgba(0,0,0,0.15),0 0 32px rgba(0,0,0,0.1);
        }
        .card.ending-card.player-light-bg .ending-draft-text {
            color: rgba(30,30,50,0.85);
        }
        .card.ending-card.player-light-bg .player-name-tag {
            color: rgba(30,30,50,0.6);
        }

        .card.ending-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.35), transparent);
            pointer-events: none;
            z-index: 1;
        }

        .card.ending-card .ending-title-wrapper {
            position: relative;
            z-index: 2;
        }

        /* 结局卡片颜色变体 */
        /* 财富 - 金色系 */
        .card.ending-card.wealth-max { background: linear-gradient(160deg, #f9e076, #e6c300, #b8960f); }
        .card.ending-card.wealth-min { background: linear-gradient(160deg, #8b6914, #6b5210, #3a2804); }
        /* 能力 - 蓝色系 */
        .card.ending-card.ability-max { background: linear-gradient(160deg, #85c1e9, #3498db, #1a5276); }
        .card.ending-card.ability-min { background: linear-gradient(160deg, #5b6c7a, #3d5060, #1a2a3a); }
        /* 团队 - 绿色系 */
        .card.ending-card.team-max { background: linear-gradient(160deg, #7dcea0, #27ae60, #145a32); }
        .card.ending-card.team-min { background: linear-gradient(160deg, #1a6e3e, #145a32, #0a2f1a); }
        /* 野心 - 红色系 */
        .card.ending-card.ambition-max { background: linear-gradient(160deg, #f1948a, #c0392b, #78281f); }
        .card.ending-card.ambition-min { background: linear-gradient(160deg, #7b5e5e, #5b3a3a, #2d1e1e); }
        /* 伤仲永 - 流星金色（辉煌过，转瞬即逝） */
        .card.ending-card.wonderkid { background: linear-gradient(160deg, #f9e79f, #c9a84c, #4a4a4a); }
        /* 球队名宿 - 暖琥珀色（沉稳忠诚） */
        .card.ending-card.club-legend { background: linear-gradient(160deg, #f0c27a, #e67e22, #6b3a1f); }
        /* 球王 - 亮白金色（终极荣耀） */
        .card.ending-card.ballon-dor { background: linear-gradient(160deg, #fef9e7, #f1c40f, #b8860b); }
        /* 正常退役 - 青灰色（宁静告别） */
        .card.ending-card.age { background: linear-gradient(160deg, #7faaaf, #4a7c82, #2c3e50); }
        /* 保底通用 */
        .card.ending-card.gold { background: linear-gradient(160deg, #f1c40f, #bf953f, #8b6914); }
        .card.ending-card.special { background: linear-gradient(160deg, #8e44ad, #3498db, #1a5276); }

        .card.grabbed { box-shadow:0 28px 70px rgba(0,0,0,0.7); }
        .card.flying-left { animation:flyLeft 0.35s cubic-bezier(0.55,0,0.9,0.5) forwards; }
        .card.flying-right { animation:flyRight 0.35s cubic-bezier(0.55,0,0.9,0.5) forwards; }
        .card.returning { transition:transform 0.4s cubic-bezier(0.25,0.8,0.25,1.2); transform:translateX(0) rotate(0deg)!important; }

        /* v2.2: 结果卡 — 统一黑底, 与事件卡明确区分 */
        .card.flipped {
            cursor: grab;
            background: #0f1923 !important;
            background-image: linear-gradient(160deg, #0f1923 0%, #141e2b 50%, #0d1520 100%) !important;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7) !important;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card.flipped .card-scene-icon { display: none; }
        .card.flipped .card-title {
            font-size: 0.65rem; letter-spacing: 2px;
            color: rgba(255,255,255,0.35) !important;
            margin-bottom: 6px;
        }
        .card.flipped .result-label {
            font-size: 1.1rem; font-weight: 800;
            letter-spacing: 6px;
            color: rgba(201,168,76,0.85);
            margin-bottom: 4px;
        }
        .card.flipped .card-description {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 10px; padding: 0;
        }
        .card.flipped .result-narrative {
            font-size: clamp(0.82rem, 2.4vw, 0.95rem);
            line-height: 1.6; text-align: center; max-width: 280px;
            color: rgba(255,255,255,0.9);
        }
        .card.flipped .result-effects {
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card.flipped .result-effects .effect-label {
            color: rgba(255,255,255,0.45);
        }
        .card.flipped .result-effects .effect-symbol {
            font-size: 0.95rem; font-weight: 700;
        }

        @keyframes flyLeft {
            0%{transform:translateX(var(--fly-start-x,0px)) rotate(var(--fly-start-r,0deg)) scale(1);opacity:1}
            100%{transform:translateX(-150vw) rotate(-28deg) scale(0.9);opacity:0}
        }
        @keyframes flyRight {
            0%{transform:translateX(var(--fly-start-x,0px)) rotate(var(--fly-start-r,0deg)) scale(1);opacity:1}
            100%{transform:translateX(150vw) rotate(28deg) scale(0.9);opacity:0}
        }

        .card.entering { animation:enterCard 0.4s cubic-bezier(0.25,0.8,0.25,1.15) forwards; }
        @keyframes enterCard {
            0%{transform:translateY(24px) scale(0.95);opacity:0}
            100%{transform:translateY(0) scale(1);opacity:1}
        }

        /* ==================== 卡片内容 ==================== */
        .card-scene-icon {
            width:clamp(64px, 18vw, 105px);
            height:clamp(64px, 18vw, 105px);
            margin-bottom:clamp(8px, 2vh, 18px);
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }

        .card-scene-icon img {
            width:100%; height:100%;
            display:block;
            object-fit:contain;
        }

        .card-title {
            font-size:clamp(0.6rem, 1.5vw, 0.75rem);
            text-transform:uppercase;
            letter-spacing:2px;
            color:#999;
            margin-bottom:clamp(6px, 1.5vh, 12px);
            font-weight:600;
            text-align:center;
            width:100%;
        }

        .card-description {
            font-size:clamp(0.85rem, 2.5vw, 1.05rem);
            text-align:center;
            color:var(--text);
            line-height:1.6;
            font-weight:400;
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:0 4px;
            width:100%;
        }

        /* ==================== 选择覆盖层 ==================== */
        .choice-overlay {
            position: absolute; top:0; left:0;
            width:100%; height:100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 10;
            padding: 20px;
        }

        .choice-overlay.visible { opacity: 1; transform: scale(1); }

        .choice-overlay .choice-label {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        /* v2.0: +/- 效果展示 (替换旧圆点系统) */
        .choice-overlay .effects-container {
            display: flex; flex-direction: column;
            gap: 8px; align-items: center;
            width: 100%;
        }

        .effect-row {
            display: flex; gap: 28px;
            justify-content: center;
            width: 100%;
        }

        .effect-item {
            display: flex; flex-direction: row;
            align-items: center; gap: 8px;
        }
        @keyframes effectPop {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .effect-item { animation: effectPop 0.3s ease-out both; }

        .effect-label {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.55);
            font-weight: 500;
            letter-spacing: 0.5px;
            width: 36px;
        }

        .effect-symbol {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
            min-width: 52px;
        }
        .effect-symbol.effect-pos { color: #2ecc71; text-shadow: 0 0 10px rgba(46,204,113,0.4); }
        .effect-symbol.effect-neg { color: #e74c3c; text-shadow: 0 0 10px rgba(231,76,60,0.4); }
        .effect-symbol.effect-neutral { color: rgba(255,255,255,0.25); }
        .effect-symbol.effect-hidden { color: rgba(255,255,255,0.5); }

        /* 声望行 */
        .effect-rep-row {
            display: flex; align-items: center; gap: 8px;
            margin-top: 4px; padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.08);
            width: 100%; justify-content: center;
        }
        .effect-rep-row .rep-label {
            color: rgba(201,168,76,0.6);
            font-size: 0.6rem; letter-spacing: 1px;
        }

        /* ==================== 属性面板（顶部） ==================== */
        .stats-panel {
            width:100%;
            display:flex; flex-direction:column; gap:6px;
            padding:10px 14px;
            background:rgba(255,255,255,0.03);
            border-radius:14px;
            border:1px solid rgba(255,255,255,0.06);
        }

        .stat-row {
            display:flex; align-items:center; gap:8px;
        }

        .stat-icon {
            width:20px; height:20px;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }

        .stat-icon img {
            width:16px; height:16px;
            display:block;
        }

        .stat-label {
            width:32px;
            font-size:0.8rem;
            color:rgba(255,255,255,0.7);
            font-weight:600;
            flex-shrink:0;
        }

        .stat-bar-outer {
            flex:1; height:8px;
            background:var(--bar-bg);
            border-radius:10px;
            overflow:hidden;
        }

        .stat-bar-inner {
            height:100%;
            border-radius:10px;
            transition:width 0.45s cubic-bezier(0.25,0.8,0.25,1.2);
        }

        /* 财富 - 金色 */
        .stat-bar-inner.wealth { background:linear-gradient(90deg,#f1c40f,#ffd700); }
        /* 能力 - 蓝色 */
        .stat-bar-inner.ability { background:linear-gradient(90deg,#3498db,#2980b9); }
        /* 团队 - 绿色 */
        .stat-bar-inner.team { background:linear-gradient(90deg,#2ecc71,#27ae60); }
        /* 野心 - 红色 */
        .stat-bar-inner.ambition { background:linear-gradient(90deg,#e74c3c,#c0392b); }

        /* 属性条微光泽 (v1.5) */
        .stat-bar-inner {
            position: relative;
            overflow: hidden;
        }
        .stat-bar-inner::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: barShimmer 3.5s ease-in-out infinite;
        }
        @keyframes barShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .danger-low { animation:pulseDanger 0.7s infinite; }
        .danger-high { animation:pulseWarning 0.55s infinite; }
        @keyframes pulseDanger { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.4) saturate(1.4)} }
        @keyframes pulseWarning { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.25) saturate(1.25)} }

        /* 顶部信息栏 - 紧凑设计（现在在底部） */
        .header {
            width:100%;
            display:flex; align-items:baseline; justify-content:space-between;
            padding:6px 12px;
            background:linear-gradient(135deg, rgba(201,168,76,0.12), rgba(201,168,76,0.04));
            border-radius:10px;
            border:1px solid rgba(201,168,76,0.2);
        }

        .age-badge {
            display:flex; align-items:baseline; gap:2px;
            color:var(--text-light);
        }

        .age-number {
            color:#fff;
            font-size:1.1rem; font-weight:700;
            font-family: var(--font-mono);
            line-height:1;
        }

        .age-unit {
            color:var(--gold);
            font-size:0.7rem; font-weight:600;
        }

        .season-indicator {
            color:var(--gold-light);
            font-size:0.7rem; font-weight:600;
        }

        .season-number {
            font-family: var(--font-mono);
            font-weight:700;
            font-size:0.85rem;
        }

        /* v1.5: 声望称呼（底部栏中央） */
        .rep-level-badge {
            font-size:0.6rem;
            color:var(--gold);
            font-weight:600;
            letter-spacing:0.5px;
            opacity:0.85;
        }

        /* ==================== 滑动提示 ==================== */
        .swipe-hint {
            color:rgba(255,255,255,0.7);
            font-size:0.7rem;
            letter-spacing:1px;
            display:flex; align-items:center; gap:10px;
            transition:opacity 0.5s;
        }

        .swipe-hint .arrow {
            display:inline-flex; align-items:center; justify-content:center;
            opacity:0.8;
        }

        .swipe-hint .arrow img {
            width:18px; height:18px;
            display:block;
        }

        @keyframes bounceHorizontalLeft {
            0%,100%{transform:translateX(0)}
            50%{transform:translateX(-6px)}
        }
        @keyframes bounceHorizontalRight {
            0%,100%{transform:translateX(0)}
            50%{transform:translateX(6px)}
        }

        .swipe-hint .arrow.left {
            animation:bounceHorizontalLeft 1.5s infinite;
        }
        .swipe-hint .arrow.right {
            animation:bounceHorizontalRight 1.5s infinite;
        }

        /* ==================== Toast通知 ==================== */
        .toast {
            position:fixed; top:20px; left:50%;
            transform:translateX(-50%) translateY(-120px);
            background:rgba(15,25,35,0.95);
            color:var(--text-light);
            padding:10px 20px;
            border-radius:20px;
            font-size:0.8rem; font-weight:600;
            z-index:100;
            pointer-events:none;
            transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            border:1px solid rgba(255,255,255,0.1);
            text-align:center;
            max-width:85vw;
            backdrop-filter:blur(10px);
            display:flex; align-items:center; justify-content:center; gap:4px;
        }

        .toast img {
            width:16px; height:16px;
            display:inline-block;
            vertical-align:middle;
        }

        .toast.show { transform:translateX(-50%) translateY(0); }

        .toast.milestone {
            background:linear-gradient(135deg, rgba(201,168,76,0.95), rgba(212,168,42,0.95));
            color:#1a1a2e;
            font-size:0.85rem;
            font-weight:700;
            border-color:rgba(255,255,255,0.2);
            box-shadow: 0 4px 30px rgba(201,168,76,0.4);
            overflow:hidden;
        }
        .toast.milestone::after {
            content:'';
            position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: barShimmer 2s ease-in-out;
        }

        /* ==================== 结局遮罩层 ==================== */
        .ending-overlay {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            background:radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.06), rgba(0,0,0,0.95) 70%);
            z-index:200;
            display:flex; flex-direction:column;
            align-items:center;
            opacity:0; pointer-events:none;
            transition:0.6s;
            padding:20px;
            overflow-y: auto;
        }

        .ending-overlay.visible { opacity:1; pointer-events:auto; }

        .result-screen {
            width: 100%; max-width: 400px;
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ending-icon {
            width:96px; height:96px;
            margin: 0 auto 12px;
            display:flex; align-items:center; justify-content:center;
            animation: endingIconPulse 2.5s ease-in-out infinite;
        }
        @keyframes endingIconPulse {
            0%,100% { filter: drop-shadow(0 0 8px rgba(201,168,76,0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(201,168,76,0.6)); }
        }

        .ending-icon img {
            width:100%; height:100%;
            display:block;
            object-fit:contain;
        }

        .ending-title { font-size:1.6rem; color:#fff; font-weight:800; display:block; margin-bottom: 8px; }
        .ending-subtitle { font-size:0.85rem; color:rgba(255,255,255,0.7); text-align:center; max-width:300px; display:block; margin: 0 auto; line-height:1.5; }
        .result-stats { font-size: 0.9rem; color: var(--gold); margin-bottom: 20px; margin-top: 12px; font-weight: 600; }

        /* v2.1: 系列进度条 (自适应定位) */
        .series-progress-bar {
            position: absolute; top: -22px; left: 10px; right: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 4px 14px;
            background: rgba(15,25,40,0.85);
            border-radius: 12px;
            border: 1px solid rgba(201,168,76,0.2);
            z-index: 5;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        /* 小屏幕：进度条缩小间距 */
        @media (max-height:700px) {
            .series-progress-bar {
                top: -18px; gap: 4px; padding: 3px 10px;
                font-size: 0.55rem;
            }
        }
        .series-progress-name {
            color: var(--gold);
            font-weight: 600;
            margin-right: 4px;
        }
        .series-progress-dots {
            color: rgba(201,168,76,0.8);
            letter-spacing: 3px;
        }
        .series-progress-num {
            color: rgba(255,255,255,0.7);
            font-family: var(--font-mono);
            font-weight: 700;
        }
        .series-progress-counter {
            color: #2ecc71;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .card-area.series-active {
            padding-top: 12px;
        }

        /* v2.1: 结算卡样式 */
        .settlement-content {
            display: flex; flex-direction: column;
            align-items: center; gap: 16px;
            width: 100%; text-align: center;
        }
        .settlement-text {
            font-size: clamp(0.82rem, 2.4vw, 0.95rem);
            color: rgba(255,255,255,0.9);
            line-height: 1.65;
            font-weight: 400;
            max-width: 280px;
        }
        .settlement-effects {
            display: flex; flex-wrap: wrap; gap: 14px;
            justify-content: center;
            padding: 10px 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .settlement-effects .effect-item {
            display: flex; align-items: center; gap: 6px;
            animation: effectPop 0.3s ease-out both;
        }
        .settlement-effects .effect-label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.45);
            font-weight: 500;
        }
        .settlement-effects .effect-label.rep-label {
            color: rgba(201,168,76,0.6);
            font-size: 0.6rem; letter-spacing: 1px;
        }
        .settlement-effects .effect-symbol {
            font-size: 1rem; font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
            min-width: 36px; text-align: center;
        }

        /* ==================== 时间线 (v2.0 赛季分割线) ==================== */
        .timeline-container {
            width: 100%; max-width: 400px;
            margin: 0 auto 30px auto;
            position: relative;
            padding: 20px 0;
        }

        .timeline-container::before {
            content: '';
            position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.3), transparent);
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .timeline-item.show { opacity: 1; transform: translateY(0); }

        .timeline-dot {
            width: 10px; height: 10px;
            background: var(--gold);
            border-radius: 50%;
            position: absolute; left: 50%; top: 15px;
            transform: translateX(-50%);
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
            z-index: 2;
            animation: timelineDotPulse 2s ease-in-out infinite;
        }
        @keyframes timelineDotPulse {
            0%,100% { box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15); }
            50% { box-shadow: 0 0 0 8px rgba(201, 168, 76, 0.08), 0 0 12px rgba(201, 168, 76, 0.2); }
        }

        .timeline-milestone-dot {
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.2), 0 0 16px rgba(201,168,76,0.4);
        }

        .timeline-content {
            width: 42%;
            background: rgba(255,255,255,0.04);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }

        .timeline-item:nth-child(odd) .timeline-content { margin-left: auto; }
        .timeline-item:nth-child(even) .timeline-content { margin-right: auto; }

        .timeline-year {
            font-size: 0.65rem;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timeline-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.4;
        }

        .timeline-milestone { color: #fff; font-weight: 600; }

        /* v2.0: 赛季分割线 */
        .timeline-season-divider {
            position: relative; width: 100%;
            text-align: center; padding: 10px 0; margin: 10px 0;
            opacity: 0; transform: translateY(8px);
            transition: all 0.5s ease;
        }
        .timeline-season-divider.show { opacity: 1; transform: translateY(0); }
        .timeline-season-divider span {
            display: inline-block;
            padding: 3px 16px;
            font-size: 0.55rem; color: var(--gold);
            font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(201,168,76,0.2);
            border-radius: 10px;
            background: rgba(10,14,20,0.8);
            position: relative; z-index: 1;
        }
        .timeline-season-divider::before {
            content: '';
            position: absolute; left: 10%; right: 10%; top: 50%;
            height: 1px;
            background: linear-gradient(to right,
                transparent, rgba(201,168,76,0.15), transparent);
        }
        .timeline-bad-dot {
            background: #e74c3c !important;
            box-shadow: 0 0 0 4px rgba(231,76,60,0.15) !important;
        }

        /* ==================== 重启按钮 ==================== */
        .restart-btn {
            margin-bottom: 20px;
            padding:12px 32px;
            background:linear-gradient(135deg, var(--gold), var(--gold-light));
            color:#1a1a2e;
            border:none;
            border-radius:24px;
            font-size:0.9rem;
            font-weight:700;
            cursor:pointer;
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .restart-btn.visible { opacity: 1; transform: translateY(0); }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(201, 168, 76, 0.4); }

        /* ==================== 结局标题 ==================== */
        .ending-title-wrapper { text-align:center; }

        .ending-glow-title {
            font-size:clamp(1.6rem, 5vw, 2.2rem);
            font-weight:800;
            color:#fff;
            text-shadow:0 0 20px rgba(255,255,255,0.6),0 0 40px rgba(255,255,255,0.3);
            margin-bottom:10px;
            line-height:1.2;
            letter-spacing:1px;
        }

        .ending-draft-text {
            font-size:clamp(0.82rem, 2.6vw, 0.95rem);
            color:rgba(255,255,255,0.85);
            line-height:1.55;
            text-shadow:none;
            padding:8px 0;
            margin-top:8px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ==================== 结局布局（引导卡/结局卡扩展到属性条中部） ==================== */
        .game-container.game-ending-active {
            height: calc(min(56vh, 420px) + 22px);
        }
        .game-container.game-ending-active .stats-panel,
        .game-container.game-ending-active .header {
            display: none;
        }
        .game-container.game-ending-active .swipe-hint {
            position: absolute;
            top: 92%;
            left: 0;
            right: 0;
            justify-content: center;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .game-container.game-ending-active .card-area {
            position: absolute;
            top: -22px;
            bottom: 0;
            left: 0;
            right: 0;
            height: auto;
        }
        .game-container.game-ending-active .card {
            height: 100%;
            padding: clamp(14px, 3vh, 28px) clamp(14px, 4vw, 22px);
            justify-content: center;
            gap: 0;
        }
        /* 结局卡片内容区域：纵向自适应 */
        .game-container.game-ending-active .card.ending-card .card-title {
            display: none;
        }
        .game-container.game-ending-active .card.ending-card .card-scene-icon {
            width: auto; height: auto;
            flex: 0 1 auto;
            min-height: 0;
            margin-bottom: clamp(6px, 1.5vh, 16px);
        }
        .game-container.game-ending-active .card.ending-card .card-description {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 0;
        }
        .game-container.game-ending-active .ending-title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
        }
        /* 球星肖像自适应容器 */
        .game-container.game-ending-active .card-scene-icon {
            width: auto; height: auto;
            flex: 0 1 auto;
            min-height: 0;
            margin-bottom: clamp(6px, 1.5vh, 16px);
        }
        .game-container.game-ending-active .ending-portrait-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 1;
            min-height: 0;
        }
        .game-container.game-ending-active .ending-portrait-wrap .ending-portrait {
            width: min(148px, 38vw);
            height: min(148px, 38vw);
        }
        /* 结局文字区域自然流动，由卡片 overflow 兜底 */
        .game-container.game-ending-active .ending-draft-text {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ==================== 响应式 ==================== */
        @media (max-width:400px) {
            .card-area { height:340px; }
            .card { padding:20px 16px 16px; }
            .card-description { font-size:0.9rem; }
            .card-scene-icon { width:56px; height:56px; }
            .choice-overlay .choice-label { font-size:1.15rem; }
            .age-number { font-size:1.3rem; }
        }

        @media (max-height:700px) {
            .card-area { height:320px; }
            .game-container { gap:8px; }
            .card-scene-icon { width:56px; height:56px; }
        }

        /* 超宽屏幕 */
        @media (min-height:900px) {
            .game-container { max-width:420px; }
            .card-area { height:min(56vh, 460px); }
        }

        /* 横屏小高度 */
        @media (orientation: landscape) and (max-height:500px) {
            .card-area { height:min(60vh, 280px); }
            .game-container { gap:6px; }
            .stats-panel { padding:6px 10px; gap:4px; }
            .stat-bar-outer { height:6px; }
            .card-scene-icon { width:48px; height:48px; }
        }

        /* ==================== 继续游戏对话框 ==================== */
        @keyframes dialogFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ==================== Debug声望面板 ==================== */
        .debug-reputation {
            display:flex; align-items:center; gap:6px;
            padding:4px 10px; margin-top:4px;
            background:rgba(201,168,76,0.15);
            border-radius:8px;
            font-size:0.65rem; color:var(--gold-light);
            font-weight:600;
        }
        .debug-rep-level {
            color:rgba(255,255,255,0.5); font-weight:400;
        }
        /* ==================== 引导卡片（特殊结局展示前）(v1.5 增强) ==================== */
        .card.teaser-card {
            cursor: pointer;
            overflow: hidden;
        }
        .card.teaser-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, transparent 70%);
            animation: teaserGlow 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes teaserGlow {
            0%,100%{ opacity: 0.5; transform: scale(1); }
            50%{ opacity: 0.9; transform: scale(1.05); }
        }
        .teaser-content {
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            min-height:120px;
            position:relative; z-index:3;
            gap:12px;
        }
        .teaser-title {
            font-size:clamp(2rem, 7vw, 2.8rem);
            font-weight:900;
            letter-spacing:0.15em;
            animation: teaserPulse 1.5s ease-in-out infinite;
            -webkit-text-stroke: 0.5px rgba(255,255,255,0.1);
        }
        @keyframes teaserPulse {
            0%,100%{ opacity:0.9; transform:scale(1); filter: brightness(1); }
            50%{ opacity:1; transform:scale(1.02); filter: brightness(1.1); }
        }
        .teaser-hint {
            font-size:clamp(0.65rem, 2vw, 0.8rem);
            opacity:0.5;
            letter-spacing:0.2em;
            animation: hintFade 2s ease-in-out infinite;
            text-transform: uppercase;
        }
        @keyframes hintFade {
            0%,100%{ opacity:0.4; transform: translateY(0); }
            50%{ opacity:0.65; transform: translateY(-1px); }
        }
        /* 引导卡片阶段隐藏空的icon和title */
        .game-container.game-ending-active .card.teaser-card .card-scene-icon,
        .game-container.game-ending-active .card.teaser-card .card-title {
            display: none;
        }
        .game-container.game-ending-active .card.teaser-card .card-description {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 引导卡片→结局卡片 3D翻牌效果 */
        .card.flip-out {
            animation: flipOut 0.55s ease-in forwards;
            pointer-events: none;
        }
        @keyframes flipOut {
            0%   { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(90deg); opacity: 0.3; }
        }
        .card.flip-in {
            animation: flipIn 0.6s ease-out forwards;
        }
        @keyframes flipIn {
            0%   { transform: rotateY(-90deg); opacity: 0.3; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }
        /* ==================== 球星模板卡片 ==================== */
        .player-template-card {
            position:relative; overflow:hidden;
        }
        /* 结局卡片-球星肖像（通用，无球星模板时使用） */
        .ending-portrait-wrap {
            display:flex; align-items:center; justify-content:center;
            width:100%; margin-bottom:8px;
        }
        .ending-portrait {
            width:100px; height:100px;
            border-radius:50%;
            border:3px solid rgba(255,255,255,0.35);
            background:rgba(255,255,255,0.08);
            display:flex; align-items:center; justify-content:center;
            overflow:hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        /* 特殊结局球星肖像（有模板匹配时由JS设置内联尺寸覆盖） */
        .ending-portrait img {
            width:100%; height:100%; object-fit:cover;
        }
        .ending-portrait-icon {
            border-style: dashed;
            border-color: rgba(255,255,255,0.2);
        }
        .player-name-tag {
            font-size:clamp(0.65rem, 2vw, 0.8rem); color:rgba(255,255,255,0.6);
            margin-top:3px; font-style:italic;
            letter-spacing:2px;
        }
        #continueOverlay > div {
            animation: dialogFadeIn 0.3s ease-out;
        }
        /* ==================== Debug面板 ==================== */
        .debug-panel {
            position:fixed; top:0; right:0; width:260px; height:100vh;
            background:rgba(10,14,20,0.97); z-index:500;
            border-left:1px solid rgba(201,168,76,0.3);
            overflow-y:auto; padding:16px;
            display:flex; flex-direction:column; gap:8px;
            font-family: var(--font-main);
            transition: transform 0.3s ease;
        }
        .debug-panel.hidden { transform: translateX(100%); }
        .debug-panel h3 {
            color:var(--gold); font-size:0.9rem;
            margin:0 0 4px 0; text-align:center;
            letter-spacing:1px;
        }
        .debug-section {
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px; padding:8px;
        }
        .debug-section h4 {
            color:rgba(255,255,255,0.5); font-size:0.65rem;
            margin:0 0 6px 0; text-transform:uppercase;
            letter-spacing:1px;
        }
        .debug-row {
            display:flex; align-items:center; gap:6px;
            margin-bottom:4px;
        }
        .debug-btn {
            flex:1; padding:5px 8px; border:1px solid rgba(255,255,255,0.15);
            border-radius:6px; background:rgba(255,255,255,0.04);
            color:rgba(255,255,255,0.8); font-size:0.6rem;
            cursor:pointer; text-align:center;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            transition: all 0.15s;
        }
        .debug-btn:hover { background:rgba(201,168,76,0.2); border-color:rgba(201,168,76,0.5); }
        .debug-btn.extreme { border-color:rgba(231,76,60,0.3); }
        .debug-btn.extreme:hover { background:rgba(231,76,60,0.15); }
        .debug-btn.hidden-ending { border-color:rgba(46,204,113,0.3); }
        .debug-btn.hidden-ending:hover { background:rgba(46,204,113,0.15); }
        .debug-btn.retire { border-color:rgba(52,152,219,0.3); }
        .debug-btn.retire:hover { background:rgba(52,152,219,0.15); }
        .debug-toggle-btn {
            position:fixed; top:10px; right:10px; z-index:501;
            width:32px; height:32px; border-radius:50%;
            border:1px solid rgba(201,168,76,0.4);
            background:rgba(10,14,20,0.9);
            color:var(--gold); font-size:0.8rem; font-weight:700;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
        }
        .debug-toggle-btn:hover { background:rgba(201,168,76,0.2); }
        .debug-rep-display {
            display:flex; align-items:center; justify-content:space-between;
            padding:6px 10px; background:rgba(201,168,76,0.1);
            border-radius:8px; margin-bottom:4px;
        }
        .debug-rep-display .rep-val { color:#fff; font-weight:700; font-size:0.85rem; }
        .debug-rep-display .rep-lvl { color:var(--gold-light); font-size:0.65rem; }
        .debug-switch {
            display:flex; align-items:center; gap:4px; font-size:0.6rem;
            color:rgba(255,255,255,0.5);
        }
        .debug-switch input { margin:0; }
    </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="toast" id="toast"></div>
<div class="debug-panel" id="debugPanel"></div>
<div class="ending-overlay" id="endingOverlay">
    <div class="result-screen" id="resultScreen">
        <div class="ending-icon" id="endingIcon"></div>
        <div class="ending-title" id="endingTitle">职业生涯结束</div>
        <div class="result-stats" id="finalStats">赛季数：0 | 事件数：0</div>
        <div class="ending-subtitle" id="endingSubtitle">你的传奇故事将被铭记</div>
    </div>

    <div class="timeline-container" id="timelineContainer"></div>
    <button class="restart-btn" id="restartBtn" onclick="restartGame()">重启人生</button>
</div>

<div class="game-container">
    <!-- 属性面板（顶部） -->
    <div class="stats-panel">
        <div class="stat-row">
            <div class="stat-icon" id="iconWealth"></div>
            <span class="stat-label">财富</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner wealth" id="barWealth" style="width:30%"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-icon" id="iconAbility"></div>
            <span class="stat-label">能力</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner ability" id="barAbility" style="width:25%"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-icon" id="iconTeam"></div>
            <span class="stat-label">团队</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner team" id="barTeam" style="width:50%"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-icon" id="iconAmbition"></div>
            <span class="stat-label">野心</span>
            <div class="stat-bar-outer"><div class="stat-bar-inner ambition" id="barAmbition" style="width:35%"></div></div>
        </div>
        <!-- Debug: 声望值（开发用，默认隐藏） -->
        <div class="debug-reputation" id="debugReputation" style="display:none;">
            ⭐ 声望: <span id="debugRepValue">1</span>
            <span class="debug-rep-level" id="debugRepLevel">默默无闻</span>
        </div>
    </div>

    <!-- 事件卡片区域（主体） -->
    <div class="card-area" id="cardArea">
        <div class="card" id="card">
            <div class="card-scene-icon" id="cardIcon"></div>
            <div class="card-title" id="cardTitle">职业生涯</div>
            <div class="card-description" id="cardDesc">滑动卡片，开启你的足球人生</div>
            <div class="choice-overlay" id="choiceOverlay">
                <div class="choice-label" id="choiceLabel"></div>
                <div class="effects-container" id="effectsContainer"></div>
            </div>
        </div>
    </div>

    <!-- 滑动提示（卡片下方） -->
    <div class="swipe-hint" id="swipeHint">
        <span class="arrow left"><img src="assets/icons/arrow_left.png" width="18" height="18" alt="" draggable="false"></span>
        左右滑动做出选择
        <span class="arrow right"><img src="assets/icons/arrow_right.png" width="18" height="18" alt="" draggable="false"></span>
    </div>

    <!-- 年龄/赛季信息栏（底部） -->
    <div class="header">
        <div class="age-badge">
            <span class="age-number" id="ageDisplay">18</span>
            <span class="age-unit">岁</span>
        </div>
        <div class="rep-level-badge" id="repLevelDisplay">默默无闻</div>
        <div class="season-indicator">
            第<span class="season-number" id="seasonDisplay">1</span>赛季
        </div>
    </div>
</div>

<!-- JS 模块（按依赖顺序加载） -->
<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/animation.js"></script>
<script src="js/icons.js"></script>
<script src="js/flags.js"></script>
<script src="js/ui.js"></script>
<script src="js/series.js"></script>
<script src="js/events_data.js"></script>
<script src="js/events.js"></script>
<script src="js/timeline.js"></script>
<script src="js/ending.js"></script>
<script src="js/card.js"></script>
<script src="js/main.js"></script>
<script src="js/debug.js"></script>
</body>
</html>
